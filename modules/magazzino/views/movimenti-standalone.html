        .form-group textarea { min-height: 60px; resize: vertical; }
        .loading { text-align: center; padding: 40px; color: #666; }
        .empty-state { text-align: center; padding: 40px; color: #999; }
        .alert { padding: 15px; border-radius: 8px; margin-bottom: 20px; }
        .alert-success { background: #d4edda; color: #155724; }
        .alert-error { background: #f8d7da; color: #721c24; }

<body>
    <div class="container">
        <div class="header">
            <div>
                <h1>📥 Movimenti Magazzino</h1>
                <p style="opacity: 0.9; margin-top: 5px;">Registra entrate e uscite</p>
            </div>
            <div class="header-actions">
                <button class="btn btn-primary" id="btn-nuovo-movimento">➕ Nuovo Movimento</button>
                <a id="link-dashboard-sezione" href="magazzino-home-standalone.html" class="btn btn-secondary">← Dashboard</a>
                <script src="../js/dashboard-sezione-link.js"></script>
            </div>
        </div>

        <div class="content">
            <div id="alert-container"></div>
            <div id="alert-documento-filter" class="alert-doc-filter" role="status">
                <span id="alert-documento-filter-text"></span>
                <button type="button" class="btn btn-secondary btn-sm" id="btn-clear-documento-filter">Mostra tutti i movimenti</button>
            </div>
            <div id="alert-carburante-filter" class="alert-doc-filter" role="status">
                <span id="alert-carburante-filter-text"></span>
                <button type="button" class="btn btn-secondary btn-sm" id="btn-clear-carburante-filter">Mostra tutti i movimenti</button>
            </div>
            <div class="filters">
                <div class="filter-group">
                    <label>Tipo</label>
                    <select id="filter-tipo">
                        <option value="">Tutti</option>
                        <option value="entrata">Entrata</option>
                        <option value="uscita">Uscita</option>
                    </select>
                </div>
                <div class="filter-group" id="filter-origine-group" style="display: none;">
                    <label for="filter-origine">Origine carburante</label>
                    <select id="filter-origine">
                        <option value="">Tutte</option>
                        <option value="carico_cisterna">Carico cisterna</option>
                        <option value="pieno">Pieno mezzo</option>
                    </select>
                </div>
                <div class="filter-group">
                    <label>Prodotto</label>
                    <select id="filter-prodotto">
                        <option value="">Tutti</option>
                    </select>
                </div>
                <div class="filter-group">
                    <label for="filter-prezzo-attesa">&nbsp;</label>
                    <label style="font-weight:500;display:flex;align-items:center;gap:6px;min-height:38px;">
                        <input type="checkbox" id="filter-prezzo-attesa"> Solo senza prezzo
                    </label>
                </div>
            </div>
            <div class="section-header">
                <h2>Elenco Movimenti</h2>
                <div class="bulk-actions">
                    <span id="movimenti-count">0 movimenti</span>
                    <span class="bulk-count" id="bulk-selected-count">0 selezionati</span>
                    <button type="button" class="btn btn-danger btn-sm" id="btn-elimina-selezionati" disabled>Elimina selezionati</button>
                </div>
            </div>
            <div id="movimenti-container" class="table-responsive">
                <div class="loading">Caricamento movimenti...</div>
            </div>
        </div>
    </div>

    <div id="movimento-modal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="modal-title">Nuovo Movimento</h3>
                <button class="close-btn" id="btn-close-modal">&times;</button>
            </div>
            <form id="movimento-form">
                <div class="form-group">
                    <label for="mov-prodotto">Prodotto *</label>
                    <select id="mov-prodotto" required>
                        <option value="">Seleziona prodotto</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="mov-data">Data *</label>
                    <input type="date" id="mov-data" required>
                </div>
                <div class="form-group">
                    <label for="mov-tipo">Tipo *</label>
                    <select id="mov-tipo" required>
                        <option value="entrata">➕ Entrata</option>
                        <option value="uscita">➖ Uscita</option>
                    </select>
                </div>
                <input type="hidden" id="mov-origine-carburante" value="">
                <div class="form-group" id="macchina-group" style="display: none;">
                    <label for="mov-macchina">Mezzo *</label>
                    <select id="mov-macchina">
                        <option value="">Seleziona mezzo</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="mov-quantita" id="label-mov-quantita">Quantità *</label>
                    <input type="number" id="mov-quantita" required min="0" step="0.01" placeholder="Es. 10">
                </div>
                <div class="form-group">
                    <label for="mov-confezione">Confezione (opzionale)</label>
                    <input type="text" id="mov-confezione" placeholder="Es. 1 bidone 5 L, 2 sacchi 25 kg">
                </div>
                <div class="form-group" id="prezzo-group">
                    <label for="mov-prezzo">Prezzo unitario (€)</label>
                    <input type="number" id="mov-prezzo" min="0" step="0.01" placeholder="Opzionale">
                </div>
                <div class="form-group">
                    <label for="mov-note">Note</label>
                    <textarea id="mov-note" placeholder="Note..."></textarea>
                </div>
                <div class="form-group">
                    <label for="mov-lavoro">Lavoro (opzionale)</label>
                    <select id="mov-lavoro">
                        <option value="">Nessuno</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="mov-attivita">Attività (opzionale)</label>
                    <select id="mov-attivita">
                        <option value="">Nessuna</option>
                    </select>
                </div>
                <div id="hint-carburante" class="alert alert-warning" style="display: none;"></div>
                <div id="alert-giacenza" class="alert alert-warning" style="display: none;">
                    La giacenza diventerà negativa. Lo scarico è comunque permesso.
                </div>
                <div style="display: flex; gap: 10px; justify-content: flex-end; margin-top: 20px;">
                    <button type="button" class="btn btn-secondary" id="btn-annulla-modal">Annulla</button>
                    <button type="submit" class="btn btn-primary">Salva</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Tony: canone liste — placeholder; renderMovimenti aggiorna summary/items, merge setContext('page'), table-data-ready -->
    <script>window.currentTableData = window.currentTableData || { pageType: 'movimenti', summary: 'Caricamento dati in corso...', items: [] };</script>
    <script type="module" src="../../../core/js/standalone-bootstrap.js" data-config-base="../../../core"></script>
    <script type="module">
        import { formatDateLikeToItalianLongLocal } from '../../../core/js/date-format-it.js';
        import { suggestMovPrezzoInDom } from '../../../core/js/movimento-prezzo-catalogo.js';
        import { getAuthInstance, getDb, onAuthStateChanged, collection, getDocs, getDoc, doc, addDoc, updateDoc, deleteDoc, query, orderBy, where, serverTimestamp, Timestamp, increment } from '../../../core/services/firebase-service.js';
        import { resolveAuthUser, loginPageUrl } from '../../../core/js/simulator-standalone-page.js';
        import { escapeHtml, showAlert } from '../../../core/js/gfv-page-utils.js';
        import { hasModuleAccessFromTenant } from '../../../core/utils/module-access-resolver.js';
        import { MovimentoMagazzino } from '../models/MovimentoMagazzino.js';
        import * as CarburanteMovimento from '../lib/carburante-movimento.js';

        window.GFVCarburanteMovimento = CarburanteMovimento;

        try {
            await window.GFVStandaloneReady;
        } catch (err) {
            console.error('[movimenti] Bootstrap failed:', err);
            throw err;
        }
        if (!window.currentTableData || !window.currentTableData.summary || window.currentTableData.summary === '') {
            window.currentTableData = { pageType: 'movimenti', summary: 'Caricamento dati in corso...', items: [] };
        }
        const auth = getAuthInstance();
        const db = getDb();
        let currentTenantId = null;
        let prodotti = [];
        let movimenti = [];
        let lavori = [];
        let attivita = [];
        let mezziPieno = [];
        let hasParcoMacchine = false;
        let editingMovimentoId = null;
        let fuelFormOpened = false;
        /** @type {Set<string>} */
        const selectedMovimentoIds = new Set();

        function formatData(d) {
            if (!d) return '-';
            const s = formatDateLikeToItalianLongLocal(d);
            return s || '-';
        }

        function formatPrezzoCell(prezzo) {
            if (prezzo === undefined || prezzo === null || prezzo === '') return '-';
            const n = Number(prezzo);
            return Number.isFinite(n) ? n.toFixed(2) : '-';
        }

        function formatPrezzoTotaleCell(prezzo, quantita) {
            const pu = Number(prezzo);
            const q = Number(quantita);
            if (!Number.isFinite(pu) || !Number.isFinite(q)) return '-';
            return (pu * q).toFixed(2);
        }

        onAuthStateChanged(auth, async (user) => {
            if (!user) user = await resolveAuthUser(auth);
            if (!user) { window.location.href = await loginPageUrl('../../../core/auth/login-standalone.html'); return; }
            try {
                const userDoc = await getDoc(doc(db, 'users', user.uid));
                if (!userDoc.exists()) { window.location.href = await loginPageUrl('../../../core/auth/login-standalone.html'); return; }
                const userData = userDoc.data();
                currentTenantId = userData.tenantId || (userData.tenantMemberships && Object.keys(userData.tenantMemberships || {})[0]);
                const ruoli = userData.ruoli || [];
                const isManager = ruoli.some(r => ((r || '').toLowerCase()).includes('manager') || ((r || '').toLowerCase()).includes('amministratore'));
                if (!isManager) {
                    showAlert('Solo Manager o Amministratore.', 'error');
                    setTimeout(() => { window.location.href = '../../../core/dashboard-standalone.html'; }, 2000);
                    return;
                }
                document.getElementById('btn-nuovo-movimento').onclick = openModal;
                document.getElementById('btn-elimina-selezionati').onclick = function () {
                    window.eliminaMovimentiSelezionati();
                };
                const btnClearDoc = document.getElementById('btn-clear-documento-filter');
                if (btnClearDoc) {
                    btnClearDoc.onclick = function () {
                        clearDocumentoFilterFromUrl();
                        selectedMovimentoIds.clear();
                        renderMovimenti();
                    };
                }
                document.getElementById('btn-close-modal').onclick = closeModal;
                document.getElementById('btn-annulla-modal').onclick = closeModal;
                document.getElementById('mov-tipo').onchange = function() {
                    var origineLock = (document.getElementById('mov-origine-carburante').value || '');
                    if (origineLock === 'carico_cisterna' && this.value !== 'entrata') this.value = 'entrata';
                    if (origineLock === 'pieno' && this.value !== 'uscita') this.value = 'uscita';
                    document.getElementById('prezzo-group').style.display = document.getElementById('mov-tipo').value === 'entrata' ? 'block' : 'none';
                    if (document.getElementById('mov-tipo').value !== 'entrata') {
                        document.getElementById('mov-prezzo').value = '';
                    } else {
                        suggestMovPrezzoInDom(prodotti);
                    }
                    checkGiacenzaAlert();
                };
                document.getElementById('mov-origine-carburante').addEventListener('change', function () {
                    applyCarburanteFormMode(this.value);
                });
                document.getElementById('mov-prodotto').onchange = function() {
                    updateQuantitaLabel();
                    suggestMovPrezzoInDom(prodotti);
                    checkGiacenzaAlert();
                };
                document.getElementById('mov-quantita').oninput = checkGiacenzaAlert;
                document.getElementById('movimento-form').onsubmit = saveMovimento;
                try {
                    const tipoQ = new URLSearchParams(window.location.search).get('tipo');
                    if (tipoQ === 'entrata' || tipoQ === 'uscita') {
                        document.getElementById('filter-tipo').value = tipoQ;
                    }
                } catch (eTipo) { /* ignore */ }
                const fuelQInit = CarburanteMovimento.parseCarburanteMovimentoQuery(window.location.search);
                const origineSel = document.getElementById('filter-origine');
                if (fuelQInit.categoria === 'carburante') {
                    document.getElementById('filter-origine-group').style.display = '';
                    if (origineSel && fuelQInit.origineFiltro) origineSel.value = fuelQInit.origineFiltro;
                    if (window.GFVSyncDashboardSezione) window.GFVSyncDashboardSezione('carburante');
                    const h1 = document.querySelector('.header h1');
                    if (h1) {
                        h1.textContent = fuelQInit.origineForm === 'pieno'
                            ? '⛽ Pieno mezzo'
                            : (fuelQInit.origineForm === 'carico_cisterna' ? '⛽ Carico cisterna' : '⛽ Movimenti carburante');
                    }
                }
                if (origineSel) origineSel.onchange = renderMovimenti;
                const btnClearFuel = document.getElementById('btn-clear-carburante-filter');
                if (btnClearFuel) btnClearFuel.onclick = function () {
                    clearCarburanteFilterFromUrl();
                    if (window.GFVSyncDashboardSezione) window.GFVSyncDashboardSezione('');
                    fuelFormOpened = true;
                    document.getElementById('filter-origine-group').style.display = 'none';
                    if (origineSel) origineSel.value = '';
                    fillProdottoSelects(false);
                    renderMovimenti();
                };
                document.getElementById('filter-tipo').onchange = renderMovimenti;
                document.getElementById('filter-prodotto').onchange = renderMovimenti;
                const chkPrezzo = document.getElementById('filter-prezzo-attesa');
                if (chkPrezzo) {
                    if (prezzoInAttesaFilterFromQuery()) chkPrezzo.checked = true;
                    chkPrezzo.onchange = renderMovimenti;
                }
                await loadProdotti();
                await loadLavori();
                await loadAttivita();
                try {
                    const tenantDoc = await getDoc(doc(db, 'tenants', currentTenantId));
                    hasParcoMacchine = tenantDoc.exists() && hasModuleAccessFromTenant(tenantDoc.data(), 'parcoMacchine');
                } catch (eMod) {
                    hasParcoMacchine = false;
                }
                if (hasParcoMacchine) await loadMezziPieno();
                await loadMovimenti();
                maybeOpenFuelForm();
            } catch (e) {
                console.error(e);
                showAlert('Errore caricamento', 'error');
            }
        });

        async function loadProdotti() {
            if (!currentTenantId) return;
            const q = query(collection(db, 'tenants', currentTenantId, 'prodotti'), orderBy('nome'));
            const snapshot = await getDocs(q);
            prodotti = [];
            snapshot.forEach(d => {
                const data = d.data();
                if (data.attivo !== false) prodotti.push({ id: d.id, ...data });
            });
            fillProdottoSelects(false);
            window.__gfvMagazzinoProdotti = prodotti;
        }

        function fuelQuery() {
            return CarburanteMovimento.parseCarburanteMovimentoQuery(window.location.search);
        }

        function prodottiCarburante() {
            return prodotti.filter(function (p) { return CarburanteMovimento.isProdottoCarburante(p); });
        }

        function optionProdotto(p) {
            const nome = (p.nome || p.codice || p.id);
            const um = p.unitaMisura || '-';
            const pu = p.prezzoUnitario != null && Number.isFinite(Number(p.prezzoUnitario)) ? String(p.prezzoUnitario) : '';
            const dataPrezzo = pu ? ` data-prezzo-unitario="${pu.replace(/"/g, '&quot;')}"` : '';
            return `<option value="${p.id}"${dataPrezzo}>${nome} (${um})</option>`;
        }

        function fillProdottoSelects(soloCarburante) {
            const selProdotto = document.getElementById('mov-prodotto');
            const selFilter = document.getElementById('filter-prodotto');
            const prev = selProdotto ? selProdotto.value : '';
            const prevFilter = selFilter ? selFilter.value : '';
            const formList = soloCarburante ? prodottiCarburante() : prodotti;
            const filterList = fuelQuery().categoria === 'carburante' ? prodottiCarburante() : prodotti;
            if (selProdotto) {
                selProdotto.innerHTML = '<option value="">Seleziona prodotto</option>' + formList.map(optionProdotto).join('');
                if (prev && formList.some(function (p) { return p.id === prev; })) selProdotto.value = prev;
                else if (soloCarburante && formList.length === 1) selProdotto.value = formList[0].id;
            }
            if (selFilter) {
                selFilter.innerHTML = '<option value="">Tutti</option>' + filterList.map(function (p) {
                    return `<option value="${p.id}">${(p.nome || p.codice || p.id)}</option>`;
                }).join('');
                if (prevFilter && filterList.some(function (p) { return p.id === prevFilter; })) selFilter.value = prevFilter;
            }
        }

        function fillMacchinaSelect() {
            const sel = document.getElementById('mov-macchina');
            if (!sel) return;
            const prev = sel.value;
            const opts = mezziPieno.map(function (m) {
                const tipo = String(m.tipoMacchina || m.tipo || '').toLowerCase();
                const extra = tipo && tipo !== 'trattore' ? ' (' + tipo + ')' : '';
                return `<option value="${m.id}">${escapeHtml(m.nome || m.id)}${extra}</option>`;
            }).join('');
            sel.innerHTML = '<option value="">Seleziona mezzo</option>' + opts;
            if (prev && mezziPieno.some(function (m) { return m.id === prev; })) sel.value = prev;
        }

        function isMezzoRifornibile(m) {
            const tipo = String(m.tipoMacchina || m.tipo || '').toLowerCase();
            if (tipo === 'attrezzo') return false;
            if (String(m.stato || '').toLowerCase() === 'dismesso') return false;
            return true;
        }

        async function loadMezziPieno() {
            if (!currentTenantId || !hasParcoMacchine) {
                mezziPieno = [];
                fillMacchinaSelect();
                return;
            }
            try {
                const snapshot = await getDocs(collection(db, 'tenants', currentTenantId, 'macchine'));
                mezziPieno = [];
                snapshot.forEach(function (d) {
                    const row = Object.assign({ id: d.id }, d.data());
                    if (isMezzoRifornibile(row)) mezziPieno.push(row);
                });
                mezziPieno.sort(function (a, b) {
                    return String(a.nome || '').localeCompare(String(b.nome || ''), 'it');
                });
                fillMacchinaSelect();
            } catch (err) {
                console.warn('Mezzi non caricati:', err);
                mezziPieno = [];
                fillMacchinaSelect();
            }
        }

        function applyCarburanteFormMode(origine) {
            const norm = CarburanteMovimento.normalizeOrigineCarburante(origine);
            const hidden = document.getElementById('mov-origine-carburante');
            if (hidden && hidden.value !== (norm || '')) hidden.value = norm || '';
            const fuel = norm === 'carico_cisterna' || norm === 'pieno';
            fillProdottoSelects(fuel);
            const tipoEl = document.getElementById('mov-tipo');
            const macGroup = document.getElementById('macchina-group');
            const macSel = document.getElementById('mov-macchina');
            const hint = document.getElementById('hint-carburante');
            const prezzoGroup = document.getElementById('prezzo-group');
            if (norm === 'carico_cisterna' && tipoEl) tipoEl.value = 'entrata';
            if (norm === 'pieno' && tipoEl) tipoEl.value = 'uscita';
            const titleEl = document.getElementById('modal-title');
            if (titleEl && !editingMovimentoId && norm === 'pieno') titleEl.textContent = 'Pieno mezzo';
            if (titleEl && !editingMovimentoId && norm === 'carico_cisterna') titleEl.textContent = 'Carico cisterna';
            if (macGroup && macSel) {
                if (norm === 'pieno') {
                    macGroup.style.display = 'block';
                    macSel.required = true;
                } else {
                    macGroup.style.display = 'none';
                    macSel.required = false;
                    macSel.value = '';
                }
            }
            if (prezzoGroup && tipoEl) prezzoGroup.style.display = tipoEl.value === 'entrata' ? 'block' : 'none';
            if (hint) {
                if (norm === 'carico_cisterna') {
                    hint.style.display = 'block';
                    hint.textContent = 'Carico cisterna: entrata sulla giacenza del carburante.';
                } else if (norm === 'pieno') {
                    hint.style.display = 'block';
                    hint.textContent = 'Pieno mezzo: uscita dalla cisterna. I litri sui lavori non sono un secondo scarico.';
                } else {
                    hint.style.display = 'none';
                    hint.textContent = '';
                }
            }
            updateQuantitaLabel();
        }

        function hasTonyPendingMovimento() {
            try {
                const raw = sessionStorage.getItem('tony_pending_intent');
                if (!raw) return false;
                const pending = JSON.parse(raw);
                return !!(pending && (pending.modalId === 'movimento-modal' || pending.magazzinoLocalIntent));
            } catch (_) {
                return false;
            }
        }

        function maybeOpenFuelForm() {
            if (fuelFormOpened) return;
            const q = fuelQuery();
            if (!q.apriForm) return;
            fuelFormOpened = true;
            if (q.origineForm === 'pieno' && !hasParcoMacchine) {
                showAlert('Il pieno richiede il Parco Macchine. Il carico cisterna resta disponibile.', 'error');
                return;
            }
            if (hasTonyPendingMovimento()) return;
            openModal();
        }

        function clearCarburanteFilterFromUrl() {
            try {
                const url = new URL(window.location.href);
                ['categoria', 'pieno', 'origine', 'origineCarburante'].forEach(function (k) { url.searchParams.delete(k); });
                window.history.replaceState({}, '', url.pathname + (url.search || '') + (url.hash || ''));
            } catch (_) { /* ignore */ }
        }

        async function loadLavori() {
            if (!currentTenantId) return;
            try {
                const q = query(collection(db, 'tenants', currentTenantId, 'lavori'), orderBy('dataInizio', 'desc'));
                const snapshot = await getDocs(q);
                lavori = [];
                snapshot.forEach(d => lavori.push({ id: d.id, ...d.data() }));
                const sel = document.getElementById('mov-lavoro');
                sel.innerHTML = '<option value="">Nessuno</option>' + lavori.map(l => {
                    const dataStr = l.dataInizio ? formatDateLikeToItalianLongLocal(l.dataInizio) : '';
                    return `<option value="${l.id}">${(l.nome || l.id)}${dataStr ? ' – ' + dataStr : ''}</option>`;
                }).join('');
            } catch (err) {
                console.warn('Lavori non caricati:', err);
                lavori = [];
            }
        }

        async function loadAttivita() {
            if (!currentTenantId) return;
            try {
                const q = query(collection(db, 'tenants', currentTenantId, 'attivita'), orderBy('data', 'desc'));
                const snapshot = await getDocs(q);
                attivita = [];
                snapshot.forEach(d => attivita.push({ id: d.id, ...d.data() }));
                const sel = document.getElementById('mov-attivita');
                sel.innerHTML = '<option value="">Nessuna</option>' + attivita.map(a => {
                    const label = [a.data, a.tipoLavoro || '', a.terrenoNome || ''].filter(Boolean).join(' – ');
                    return `<option value="${a.id}">${label || a.id}</option>`;
                }).join('');
            } catch (err) {
                console.warn('Attività non caricate:', err);
                attivita = [];
            }
        }

        async function loadMovimenti() {
            const container = document.getElementById('movimenti-container');
            container.innerHTML = '<div class="loading">Caricamento movimenti...</div>';
            try {
                if (!currentTenantId) { container.innerHTML = '<div class="empty-state">Nessun tenant</div>'; return; }
                const q = query(collection(db, 'tenants', currentTenantId, 'movimentiMagazzino'), orderBy('data', 'desc'));
                const snapshot = await getDocs(q);
                movimenti = [];
                snapshot.forEach(d => movimenti.push({ id: d.id, ...d.data() }));
                renderMovimenti();
            } catch (err) {
                console.error(err);
                showAlert('Errore: ' + err.message, 'error');
                container.innerHTML = '<div class="empty-state">Errore caricamento</div>';
            }
        }

        function documentoFilterFromQuery() {
            try {
                return new URLSearchParams(window.location.search).get('documento') || '';
            } catch (_) {
                return '';
            }
        }

        function prezzoInAttesaFilterFromQuery() {
            try {
                const v = new URLSearchParams(window.location.search).get('prezzoInAttesa');
                return v === '1' || v === 'true' || v === 'yes';
            } catch (_) {
                return false;
            }
        }

        function clearDocumentoFilterFromUrl() {
            try {
                const url = new URL(window.location.href);
                if (!url.searchParams.has('documento')) return false;
                url.searchParams.delete('documento');
                window.history.replaceState({}, '', url.pathname + (url.search || '') + (url.hash || ''));
                return true;
            } catch (_) {
                return false;
            }
        }

        function updateDocumentoFilterBanner(filteredCount) {
            const banner = document.getElementById('alert-documento-filter');
            const textEl = document.getElementById('alert-documento-filter-text');
            const docId = documentoFilterFromQuery();
            if (!banner || !textEl) return;
            if (!docId) {
                banner.classList.remove('visible');
                textEl.textContent = '';
                return;
            }
            const shortId = docId.length > 12 ? docId.slice(0, 8) + '…' : docId;
            textEl.innerHTML =
                '<strong>Filtro documento attivo</strong> (da Archivio): mostro solo i movimenti collegati a questa acquisizione' +
                ' <code style="font-size:12px;">' + String(shortId).replace(/</g, '') + '</code>.' +
                ' In elenco: <strong>' + filteredCount + '</strong> di <strong>' + movimenti.length + '</strong> totali nel magazzino.' +
                ' Eliminare qui non cancella gli altri movimenti.';
            banner.classList.add('visible');
        }

        function filterMovimenti() {
            const tipo = document.getElementById('filter-tipo').value;
            const prodottoId = document.getElementById('filter-prodotto').value;
            const origineSel = document.getElementById('filter-origine');
            const origine = origineSel && document.getElementById('filter-origine-group').style.display !== 'none'
                ? (origineSel.value || '')
                : '';
            const docId = documentoFilterFromQuery();
            const soloPrezzoAttesa = !!(document.getElementById('filter-prezzo-attesa') &&
                document.getElementById('filter-prezzo-attesa').checked);
            const qFuel = fuelQuery();
            return movimenti.filter(m => {
                const prodotto = prodotti.find(function (p) { return p.id === m.prodottoId; });
                if (!CarburanteMovimento.movimentoMatchesCarburanteFiltro(m, prodotto, {
                    categoria: qFuel.categoria,
                    tipo: tipo || null,
                    prodottoId: prodottoId || null,
                    origineCarburante: origine || null
                })) return false;
                if (docId) {
                    const linked = m.documentoAcquisitoId === docId || m.documentoFatturaId === docId;
                    if (!linked) return false;
                }
                if (soloPrezzoAttesa) {
                    if (m.tipo != null && m.tipo !== 'entrata') return false;
                    if (!(m.prezzoInAttesa === true || m.prezzoUnitario == null)) return false;
                }
                return true;
            });
        }

        function getProdottoNome(id) {
            const p = prodotti.find(x => x.id === id);
            return p ? (p.nome || p.codice || id) : id;
        }

        function getMacchinaNome(id) {
            if (!id) return '-';
            const m = mezziPieno.find(function (x) { return x.id === id; });
            return m ? (m.nome || m.id) : id;
        }

        function updateCarburanteFilterBanner(filteredCount) {
            const banner = document.getElementById('alert-carburante-filter');
            const textEl = document.getElementById('alert-carburante-filter-text');
            if (!banner || !textEl) return;
            const q = fuelQuery();
            if (q.categoria !== 'carburante') {
                banner.classList.remove('visible');
                textEl.textContent = '';
                return;
            }
            const gesto = q.origineForm === 'pieno'
                ? 'Pieno mezzo'
                : (q.origineForm === 'carico_cisterna' ? 'Carico cisterna' : 'Carburante');
            textEl.innerHTML = '<strong>' + gesto + '</strong>: in elenco i movimenti dei prodotti carburante (<strong>' + filteredCount + '</strong>).';
            banner.classList.add('visible');
        }

        function getProdottoUnita(id) {
            const p = prodotti.find(x => x.id === id);
            return p && p.unitaMisura ? p.unitaMisura : '';
        }

        function getLavoroNome(id) {
            if (!id) return '-';
            const l = lavori.find(x => x.id === id);
            return l ? (l.nome || l.id) : id;
        }

        function getAttivitaLabel(id) {
            if (!id) return '-';
            const a = attivita.find(x => x.id === id);
            if (!a) return id;
            const parts = [a.data, a.tipoLavoro, a.terrenoNome].filter(Boolean);
            return parts.length ? parts.join(' – ') : a.id;
        }

        function updateQuantitaLabel() {
            const prodottoId = document.getElementById('mov-prodotto').value;
            const label = document.getElementById('label-mov-quantita');
            const unita = getProdottoUnita(prodottoId);
            label.textContent = unita ? `Quantità (${unita}) *` : 'Quantità *';
        }

        function renderMovimenti() {
            const filtered = filterMovimenti();
            const summary = 'Ci sono ' + filtered.length + ' movimenti in elenco.';
            window.currentTableData = {
                pageType: 'movimenti',
                summary: summary,
                items: filtered.map(m => ({
                    data: formatData(m.data),
                    prodotto: getProdottoNome(m.prodottoId),
                    tipo: m.tipo === 'entrata' ? 'carico' : 'scarico',
                    quantita: Number(m.quantita),
                    operatore: (m.operatore || m.createdBy || '-'),
                    origineCarburante: m.origineCarburante || null,
                    macchina: getMacchinaNome(m.macchinaId)
                }))
            };
            if (window.Tony && typeof window.Tony.setContext === 'function') {
                var qFuelCtx = fuelQuery();
                window.Tony.setContext('page', Object.assign({}, window.Tony.context && window.Tony.context.page || {}, {
                    pageType: 'movimenti',
                    tableDataSummary: window.currentTableData.summary,
                    currentTableData: window.currentTableData,
                    carburante: qFuelCtx.categoria === 'carburante' ? {
                        categoria: 'carburante',
                        origineForm: qFuelCtx.origineForm,
                        pieno: qFuelCtx.origineForm === 'pieno'
                    } : null
                }));
            }
            try { window.dispatchEvent(new CustomEvent('table-data-ready', { detail: { currentTableData: window.currentTableData } })); } catch (e) {}

            const docFilter = documentoFilterFromQuery();
            document.getElementById('movimenti-count').textContent = docFilter
                ? (filtered.length + ' di ' + movimenti.length + ' movimenti (filtro documento)')
                : (filtered.length + ' movimenti');
            updateDocumentoFilterBanner(filtered.length);
            updateCarburanteFilterBanner(filtered.length);
            const container = document.getElementById('movimenti-container');
            Array.from(selectedMovimentoIds).forEach(function (id) {
                if (!movimenti.some(function (m) { return m.id === id; })) selectedMovimentoIds.delete(id);
            });
            if (filtered.length === 0) {
                if (docFilter) {
                    container.innerHTML =
                        '<div class="empty-state">' +
                        '<p>Nessun movimento collegato a questo documento.</p>' +
                        '<p style="margin-top:12px;font-size:14px;color:#666;">Gli altri movimenti del magazzino possono esserci ancora: usa «Mostra tutti i movimenti» sopra.</p>' +
                        '<p style="margin-top:16px;"><button type="button" class="btn btn-primary btn-sm" id="btn-empty-clear-doc-filter">Mostra tutti i movimenti</button></p>' +
                        '</div>';
                    const btnEmpty = container.querySelector('#btn-empty-clear-doc-filter');
                    if (btnEmpty) {
                        btnEmpty.addEventListener('click', function () {
                            clearDocumentoFilterFromUrl();
                            selectedMovimentoIds.clear();
                            renderMovimenti();
                        });
                    }
                } else {
                    container.innerHTML = '<div class="empty-state">Nessun movimento trovato</div>';
                }
                updateBulkSelectionUi();
                return;
            }
            const allVisibleSelected = filtered.every(function (m) { return selectedMovimentoIds.has(m.id); });
            const showMezzo = fuelQuery().categoria === 'carburante';
            container.innerHTML = `
                <table class="movimenti-table">
                    <thead><tr>
                        <th class="col-check"><input type="checkbox" id="check-select-all" title="Seleziona tutti i movimenti visibili" ${allVisibleSelected ? 'checked' : ''}></th>
                        <th>Data</th><th>Prodotto</th><th>Tipo</th><th>Quantità</th>${showMezzo ? '<th>Mezzo</th>' : ''}<th>Confezione</th><th>Prezzo unit. (€)</th><th>Prezzo tot. (€)</th><th>Lavoro</th><th>Attività</th><th>Note</th><th>Azioni</th>
                    </tr></thead>
                    <tbody>
                        ${filtered.map(m => `
                            <tr>
                                <td class="col-check"><input type="checkbox" class="mov-row-check" data-id="${m.id}"${selectedMovimentoIds.has(m.id) ? ' checked' : ''}></td>
                                <td>${formatData(m.data)}</td>
                                <td>${escapeHtml(getProdottoNome(m.prodottoId))}</td>
                                <td><span class="badge-${m.tipo === 'entrata' ? 'entrata' : 'uscita'}">${m.origineCarburante === 'pieno' ? 'Pieno' : (m.origineCarburante === 'carico_cisterna' ? 'Carico cisterna' : (m.tipo === 'entrata' ? '➕ Entrata' : '➖ Uscita'))}</span></td>
                                <td>${Number(m.quantita)} ${escapeHtml(getProdottoUnita(m.prodottoId) || '')}</td>
                                ${showMezzo ? `<td>${escapeHtml(getMacchinaNome(m.macchinaId))}</td>` : ''}
                                <td>${escapeHtml((m.confezione || '').substring(0, 25))}${(m.confezione || '').length > 25 ? '...' : ''}</td>
                                <td>${formatPrezzoCell(m.prezzoUnitario)}</td>
                                <td>${formatPrezzoTotaleCell(m.prezzoUnitario, m.quantita)}</td>
                                <td>${escapeHtml(getLavoroNome(m.lavoroId))}</td>
                                <td>${escapeHtml(getAttivitaLabel(m.attivitaId))}</td>
                                <td>${escapeHtml((m.note || '').substring(0, 30))}${(m.note || '').length > 30 ? '...' : ''}</td>
                                <td class="action-buttons">
                                    ${(m.documentoAcquisitoId || m.documentoFatturaId)
                                        ? `<a class="btn btn-secondary btn-sm" href="documenti-acquisiti-standalone.html?id=${encodeURIComponent(m.documentoAcquisitoId || m.documentoFatturaId)}" title="Apri originale in Archivio documenti">Documento</a>`
                                        : ''}
                                    <button type="button" class="btn btn-warning btn-sm" data-action="modifica" data-id="${m.id}">Modifica</button>
                                    <button type="button" class="btn btn-danger btn-sm" data-action="elimina" data-id="${m.id}">Elimina</button>
                                </td>
                            </tr>
                        `).join('')}
                    </tbody>
                </table>`;

            const selectAll = container.querySelector('#check-select-all');
            if (selectAll) {
                selectAll.addEventListener('change', function () {
                    filtered.forEach(function (m) {
                        if (selectAll.checked) selectedMovimentoIds.add(m.id);
                        else selectedMovimentoIds.delete(m.id);
                    });
                    container.querySelectorAll('.mov-row-check').forEach(function (cb) {
                        cb.checked = selectAll.checked;
                    });
                    updateBulkSelectionUi();
                });
            }
            container.querySelectorAll('.mov-row-check').forEach(function (cb) {
                cb.addEventListener('change', function () {
                    const id = cb.getAttribute('data-id');
                    if (cb.checked) selectedMovimentoIds.add(id);
                    else selectedMovimentoIds.delete(id);
                    if (selectAll) {
                        selectAll.checked = filtered.every(function (m) { return selectedMovimentoIds.has(m.id); });
                    }
                    updateBulkSelectionUi();
                });
            });
            container.querySelectorAll('[data-action]').forEach(function (btn) {
                btn.addEventListener('click', function () {
                    const action = btn.getAttribute('data-action');
                    const id = btn.getAttribute('data-id');
                    if (action === 'modifica') window.modificaMovimento(id);
                    else if (action === 'elimina') window.eliminaMovimento(id);
                });
            });
            updateBulkSelectionUi();
        }

        function updateBulkSelectionUi() {
            const n = selectedMovimentoIds.size;
            const countEl = document.getElementById('bulk-selected-count');
            const btn = document.getElementById('btn-elimina-selezionati');
            if (countEl) countEl.textContent = n + ' selezionat' + (n === 1 ? 'o' : 'i');
            if (btn) btn.disabled = n === 0;
        }

        function checkGiacenzaAlert() {
            const tipo = document.getElementById('mov-tipo').value;
            const prodottoId = document.getElementById('mov-prodotto').value;
            const quantita = parseFloat(document.getElementById('mov-quantita').value) || 0;
            if (tipo !== 'uscita' || !prodottoId || quantita <= 0) {
                document.getElementById('alert-giacenza').style.display = 'none';
                return;
            }
            const p = prodotti.find(x => x.id === prodottoId);
            const giacenza = p && (p.giacenza != null) ? p.giacenza : 0;
            if (quantita > giacenza) {
                document.getElementById('alert-giacenza').style.display = 'block';
            } else {
                document.getElementById('alert-giacenza').style.display = 'none';
            }
        }

        function dataToInputValue(d) {
            if (!d) return '';
            const date = d.toDate ? d.toDate() : new Date(d);
            return date.toISOString().slice(0, 10);
        }

        window.modificaMovimento = function(movimentoId) {
            const m = movimenti.find(x => x.id === movimentoId);
            if (!m) return;
            editingMovimentoId = movimentoId;
            document.getElementById('modal-title').textContent = 'Modifica Movimento';
            document.getElementById('mov-prodotto').value = m.prodottoId || '';
            document.getElementById('mov-data').value = dataToInputValue(m.data);
            document.getElementById('mov-tipo').value = m.tipo || 'entrata';
            document.getElementById('mov-quantita').value = m.quantita != null ? m.quantita : '';
            document.getElementById('mov-confezione').value = m.confezione || '';
            const pu = m.prezzoUnitario;
            document.getElementById('mov-prezzo').value =
                pu !== undefined && pu !== null && pu !== '' && Number.isFinite(Number(pu)) ? String(pu) : '';
            document.getElementById('mov-note').value = m.note || '';
            document.getElementById('mov-lavoro').value = m.lavoroId || '';
            document.getElementById('mov-attivita').value = m.attivitaId || '';
            document.getElementById('mov-origine-carburante').value = m.origineCarburante || '';
            applyCarburanteFormMode(m.origineCarburante || '');
            document.getElementById('mov-macchina').value = m.macchinaId || '';
            document.getElementById('mov-prodotto').value = m.prodottoId || '';
            document.getElementById('prezzo-group').style.display = (m.tipo || 'entrata') === 'entrata' ? 'block' : 'none';
            document.getElementById('alert-giacenza').style.display = 'none';
            updateQuantitaLabel();
            document.getElementById('movimento-modal').classList.add('active');
        };

        async function applyGiacenzaDelta(prodottoId, delta) {
            if (!prodottoId) return;
            const n = Number(delta);
            if (!Number.isFinite(n) || n === 0) return;
            const prodRef = doc(db, 'tenants', currentTenantId, 'prodotti', prodottoId);
            const prodSnap = await getDoc(prodRef);
            if (!prodSnap.exists()) return;
            await updateDoc(prodRef, { giacenza: increment(n), updatedAt: serverTimestamp() });
        }

        /**
         * @param {string} movimentoId
         * @returns {Promise<{ ok: boolean, reason?: string }>}
         */
        async function tryDeleteMovimentoById(movimentoId) {
            const mov = movimenti.find(m => m.id === movimentoId);
            if (!mov) return { ok: false, reason: 'non trovato' };
            if (mov.prodottoId) {
                const delta = mov.tipo === 'entrata' ? -Number(mov.quantita || 0) : Number(mov.quantita || 0);
                await deleteDoc(doc(db, 'tenants', currentTenantId, 'movimentiMagazzino', movimentoId));
                await applyGiacenzaDelta(mov.prodottoId, delta);
            } else {
                await deleteDoc(doc(db, 'tenants', currentTenantId, 'movimentiMagazzino', movimentoId));
            }
            selectedMovimentoIds.delete(movimentoId);
            return { ok: true };
        }

        window.eliminaMovimento = async function(movimentoId) {
            if (!confirm('Eliminare questo movimento? La giacenza del prodotto verrà ripristinata.')) return;
            try {
                const result = await tryDeleteMovimentoById(movimentoId);
                if (!result.ok) {
                    showAlert('Errore: ' + (result.reason || 'eliminazione non riuscita'), 'error');
                    return;
                }
                showAlert('Movimento eliminato. Giacenza ripristinata.', 'success');
                await loadProdotti();
                await loadMovimenti();
            } catch (e) {
                showAlert('Errore: ' + e.message, 'error');
            }
        };

        window.eliminaMovimentiSelezionati = async function() {
            const ids = Array.from(selectedMovimentoIds);
            if (!ids.length) return;
            const docFilter = documentoFilterFromQuery();
            let confirmMsg =
                'Eliminare definitivamente ' + ids.length + ' moviment' + (ids.length === 1 ? 'o' : 'i') +
                ' selezionat' + (ids.length === 1 ? 'o' : 'i') +
                '?\nLa giacenza dei prodotti verrà ripristinata. Operazione non annullabile.';
            if (docFilter) {
                confirmMsg +=
                    '\n\nNota: è attivo il filtro documento (da Archivio). Verranno eliminati solo questi ' +
                    ids.length + ' selezionati, non tutti i movimenti del magazzino.';
            }
            if (!confirm(confirmMsg)) return;
            const btn = document.getElementById('btn-elimina-selezionati');
            if (btn) btn.disabled = true;
            let deleted = 0;
            const failed = [];
            try {
                for (let i = 0; i < ids.length; i++) {
                    try {
                        const result = await tryDeleteMovimentoById(ids[i]);
                        if (result.ok) deleted += 1;
                        else failed.push(ids[i] + ' (' + (result.reason || 'skip') + ')');
                    } catch (e) {
                        failed.push(ids[i] + ' (' + (e.message || 'errore') + ')');
                    }
                }
                let msg = 'Eliminati ' + deleted + ' moviment' + (deleted === 1 ? 'o' : 'i') + '. Giacenze aggiornate.';
                if (failed.length) {
                    msg += ' Non eliminati: ' + failed.slice(0, 5).join('; ') +
                        (failed.length > 5 ? ' … (+' + (failed.length - 5) + ')' : '') + '.';
                }
                // Dopo delete sotto filtro documento: togli il filtro così non sembra “magazzino vuoto”
                if (docFilter) {
                    clearDocumentoFilterFromUrl();
                    msg += ' Mostro di nuovo tutti i movimenti.';
                }
                showAlert(msg, !deleted && failed.length ? 'error' : 'success');
                selectedMovimentoIds.clear();
                await loadProdotti();
                await loadMovimenti();
            } catch (e) {
                showAlert('Errore: ' + e.message, 'error');
                updateBulkSelectionUi();
            }
        };

        function openModal() {
            editingMovimentoId = null;
            const q = fuelQuery();
            const titolo = q.origineForm === 'pieno'
                ? 'Pieno mezzo'
                : (q.origineForm === 'carico_cisterna' ? 'Carico cisterna' : 'Nuovo Movimento');
            document.getElementById('modal-title').textContent = titolo;
            document.getElementById('movimento-form').reset();
            document.getElementById('mov-data').value = new Date().toISOString().slice(0, 10);
            document.getElementById('alert-giacenza').style.display = 'none';
            document.getElementById('mov-lavoro').value = '';
            document.getElementById('mov-attivita').value = '';
            applyCarburanteFormMode(q.origineForm || '');
            document.getElementById('movimento-modal').classList.add('active');
        }

        function closeModal() {
            document.getElementById('movimento-modal').classList.remove('active');
        }

        async function saveMovimento(e) {
            e.preventDefault();
            const prodottoId = document.getElementById('mov-prodotto').value;
            const dataVal = document.getElementById('mov-data').value;
            const tipo = document.getElementById('mov-tipo').value;
            const quantita = parseFloat(document.getElementById('mov-quantita').value);
            const prezzoUnitario = document.getElementById('mov-prezzo').value ? parseFloat(document.getElementById('mov-prezzo').value) : null;
            const confezione = (document.getElementById('mov-confezione').value || '').trim();
            const note = (document.getElementById('mov-note').value || '').trim();
            const lavoroId = (document.getElementById('mov-lavoro').value || '').trim() || null;
            const attivitaId = (document.getElementById('mov-attivita').value || '').trim() || null;
            const origineRaw = (document.getElementById('mov-origine-carburante').value || '').trim() || null;
            const macchinaId = (document.getElementById('mov-macchina').value || '').trim() || null;
            if (!prodottoId || !dataVal || !tipo || !quantita || quantita <= 0) {
                showAlert('Compila tutti i campi obbligatori e una quantità positiva.', 'error');
                return;
            }
            const modello = new MovimentoMagazzino({
                prodottoId,
                data: new Date(dataVal + 'T12:00:00'),
                tipo,
                quantita,
                prezzoUnitario: tipo === 'entrata' ? prezzoUnitario : null,
                origineCarburante: origineRaw,
                macchinaId: origineRaw === 'pieno' ? macchinaId : null
            });
            const validation = modello.validate();
            if (!validation.valid) {
                showAlert(validation.errors[0] || 'Dati movimento non validi.', 'error');
                return;
            }
            if (modello.origineCarburante) {
                const prodScelto = prodotti.find(function (p) { return p.id === prodottoId; });
                if (!CarburanteMovimento.isProdottoCarburante(prodScelto)) {
                    showAlert('Scegli un prodotto della categoria carburante.', 'error');
                    return;
                }
            }
            if (modello.origineCarburante === 'pieno' && !hasParcoMacchine) {
                showAlert('Il pieno richiede il Parco Macchine. Il carico cisterna resta disponibile.', 'error');
                return;
            }
            try {
                const movimentoData = {
                    prodottoId,
                    data: Timestamp.fromDate(new Date(dataVal)),
                    tipo,
                    quantita,
                    prezzoUnitario: tipo === 'entrata' ? prezzoUnitario : null,
                    confezione: confezione || null,
                    note,
                    lavoroId,
                    attivitaId,
                    macchinaId: modello.macchinaId,
                    origineCarburante: modello.origineCarburante,
                    userId: auth.currentUser?.uid || null,
                    updatedAt: serverTimestamp()
                };

                if (editingMovimentoId) {
                    const movRef = doc(db, 'tenants', currentTenantId, 'movimentiMagazzino', editingMovimentoId);
                    const movOld = movimenti.find(x => x.id === editingMovimentoId);
                    const deltaOld = movOld.tipo === 'entrata' ? -movOld.quantita : movOld.quantita;
                    const deltaNew = tipo === 'entrata' ? quantita : -quantita;

                    await applyGiacenzaDelta(movOld.prodottoId, deltaOld);
                    await applyGiacenzaDelta(prodottoId, deltaNew);
                    await updateDoc(movRef, movimentoData);
                    showAlert('Movimento aggiornato.', 'success');
                } else {
                    movimentoData.createdAt = serverTimestamp();
                    await addDoc(collection(db, 'tenants', currentTenantId, 'movimentiMagazzino'), movimentoData);
                    await applyGiacenzaDelta(prodottoId, tipo === 'entrata' ? quantita : -quantita);
                    showAlert('Movimento registrato.', 'success');
                }

                closeModal();
                editingMovimentoId = null;
                await loadProdotti();
                await loadMovimenti();
            } catch (err) {
                showAlert('Errore: ' + err.message, 'error');
            }
        }
    </script>
</body>
</html>
