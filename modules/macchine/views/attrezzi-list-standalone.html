<!DOCTYPE html>
<html lang="it">
<head>
    <script>try{if(/[?&]emulator=1/.test(location.search)||localStorage.getItem('gfv_firebase_emulator')==='1')localStorage.setItem('gfv_firebase_emulator','1');}catch(e){}</script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elenco Attrezzature - Parco Macchine - GFV Platform</title>
    <link rel="stylesheet" href="../../../core/styles/responsive-standalone.css">
    <link rel="stylesheet" href="../../../core/styles/list-views.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <div>
                <h1>🛠️ Elenco Attrezzature</h1>
                <p style="opacity: 0.9; margin-top: 4px; font-size: 14px;">Solo mezzi con tipo Attrezzo</p>
            </div>
            <div class="header-actions">
                <button type="button" class="btn btn-primary" id="btn-nuovo">➕ Nuova Attrezzatura</button>
                <a href="macchine-dashboard-standalone.html" class="btn btn-secondary">← Dashboard</a>
            </div>
        </div>
        <div class="content">
            <div id="alert-container"></div>
            <div class="filters">
                <div class="filter-group">
                    <label>Cerca</label>
                    <input type="text" id="filter-search" placeholder="Nome, marca...">
                </div>
            </div>
            <div class="section-header">
                <h2>Attrezzature</h2>
                <span id="count-label">0 attrezzi</span>
            </div>
            <div id="table-container" class="table-responsive">
                <div class="loading">Caricamento...</div>
            </div>
        </div>
    </div>

    <div id="modal-nuovo" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Nuova Attrezzatura</h3>
                <button type="button" class="close-btn" id="btn-close-modal">&times;</button>
            </div>
            <form id="form-nuovo">
                <input type="hidden" id="tipoMacchina" value="attrezzo">
                <div class="form-group">
                    <label for="nome">Nome *</label>
                    <input type="text" id="nome" required placeholder="es. Frangizolle" minlength="3">
                </div>
                <div class="form-group">
                    <label for="categoriaId">Categoria *</label>
                    <select id="categoriaId" required>
                        <option value="">— Seleziona categoria —</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="cavalliMinimiRichiesti">Cavalli minimi richiesti (CV) *</label>
                    <input type="number" id="cavalliMinimiRichiesti" required min="1" max="1000" step="0.1" placeholder="es. 80">
                </div>
                <div style="display: flex; gap: 10px; justify-content: flex-end; margin-top: 20px;">
                    <button type="button" class="btn btn-secondary" id="btn-annulla">Annulla</button>
                    <button type="submit" class="btn btn-primary">Salva</button>
                </div>
            </form>
        </div>
    </div>

    <script>window.currentTableData = window.currentTableData || { pageType: 'attrezzi', summary: 'Caricamento dati in corso...', items: [] };</script>
    <script type="module" src="../../../core/js/standalone-bootstrap.js" data-config-base="../../../core"></script>
    <script type="module">
        (async function() {
            try {
                await window.GFVStandaloneReady;
            } catch (err) {
                console.error('[attrezzi] Bootstrap failed:', err);
                throw err;
            }
            if (!window.currentTableData || !window.currentTableData.summary || window.currentTableData.summary === '') {
                window.currentTableData = { pageType: 'attrezzi', summary: 'Caricamento dati in corso...', items: [] };
            }
            const firebaseService = await import('../../../core/services/firebase-service.js');
            const { getDb, getDoc, doc, getCollectionData } = firebaseService;
            const { resolveAuthUser, loginPageUrl } = await import('../../../core/js/simulator-standalone-page.js');
            const { getCurrentTenantId, setCurrentTenantId } = await import('../../../core/services/tenant-service.js');
            const { getAllMacchine, createMacchina } = await import('../../parco-macchine/services/macchine-service.js');
            const { escapeHtml, showAlert } = await import('../../../core/js/gfv-page-utils.js');
            const auth = firebaseService.getAuthInstance();
            const db = getDb();

            let list = [];
            let categorie = [];
            const TIPO = 'attrezzo';
            function statoBadge(s) {
                const v = (s || '').toLowerCase();
                if (v === 'disponibile') return '<span class="badge badge-disponibile">Disponibile</span>';
                if (v === 'in_uso') return '<span class="badge badge-in-uso">In uso</span>';
                return escapeHtml(s || '-');
            }

            function filterList() {
                const q = (document.getElementById('filter-search').value || '').toLowerCase();
                return list.filter(m => !q || (m.nome || '').toLowerCase().includes(q) || (m.marca || '').toLowerCase().includes(q));
            }

            function renderTable() {
                const filtered = filterList();
                document.getElementById('count-label').textContent = filtered.length + ' attrezzi';
                const container = document.getElementById('table-container');
                const catMap = new Map(categorie.map(c => [c.id, c.nome]));
                window.currentTableData = {
                    pageType: 'attrezzi',
                    summary: filtered.length === 0 ? 'Nessuna attrezzatura in elenco.' : 'Ci sono ' + filtered.length + ' attrezzature in elenco.',
                    items: filtered.map(m => ({
                        nome: m.nome || '-',
                        categoria: catMap.get(m.categoriaId) || m.categoriaId || '-',
                        cavalliMinimi: m.cavalliMinimiRichiesti,
                        stato: m.stato || '-'
                    }))
                };
                if (window.Tony && typeof window.Tony.setContext === 'function') {
                    window.Tony.setContext('page', Object.assign({}, window.Tony.context && window.Tony.context.page || {}, { tableDataSummary: window.currentTableData.summary, currentTableData: window.currentTableData }));
                }
                try { window.dispatchEvent(new CustomEvent('table-data-ready', { detail: { currentTableData: window.currentTableData } })); } catch (e) {}
                if (filtered.length === 0) {
                    container.innerHTML = '<div class="empty-state">Nessuna attrezzatura trovata</div>';
                    return;
                }
                container.innerHTML = '<table class="mezzi-table"><thead><tr><th>Nome</th><th>Categoria</th><th>CV min.</th><th>Stato</th></tr></thead><tbody>' +
                    filtered.map(m => '<tr><td>' + escapeHtml(m.nome || '-') + '</td><td>' + escapeHtml(catMap.get(m.categoriaId) || m.categoriaId || '-') + '</td><td>' + (m.cavalliMinimiRichiesti != null ? m.cavalliMinimiRichiesti : '-') + '</td><td>' + statoBadge(m.stato) + '</td></tr>').join('') + '</tbody></table>';
            }

            async function loadCategorie(tenantId) {
                try {
                    const docs = await getCollectionData('categorie', { tenantId });
                    categorie = (docs || []).filter(c => !c.parentId).map(c => ({ id: c.id, nome: c.nome || c.codice || c.id }));
                    const sel = document.getElementById('categoriaId');
                    sel.innerHTML = '<option value="">— Seleziona categoria —</option>' + categorie.map(c => '<option value="' + escapeHtml(c.id) + '">' + escapeHtml(c.nome) + '</option>').join('');
                } catch (e) { console.warn('Categorie non caricate:', e); }
            }

            function openModal() { document.getElementById('modal-nuovo').classList.add('active'); }
            function closeModal() { document.getElementById('modal-nuovo').classList.remove('active'); document.getElementById('form-nuovo').reset(); }

            async function loadData() {
                const container = document.getElementById('table-container');
                container.innerHTML = '<div class="loading">Caricamento...</div>';
                try {
                    const macchine = await getAllMacchine({ soloAttive: false });
                    list = (macchine || []).filter(m => (m.tipoMacchina || m.tipo || '').toLowerCase() === TIPO);
                    renderTable();
                } catch (err) {
                    console.error(err);
                    showAlert('Errore: ' + err.message, 'error');
                    container.innerHTML = '<div class="empty-state">Errore caricamento</div>';
                }
            }

            auth.onAuthStateChanged(async (user) => {
                if (!user) user = await resolveAuthUser(auth);
                if (!user) { window.location.href = await loginPageUrl('../../../core/auth/login-standalone.html'); return; }
                let tenantId = getCurrentTenantId();
                if (!tenantId) {
                    const ud = await getDoc(doc(db, 'users', user.uid));
                    if (ud.exists() && ud.data().tenantId) { tenantId = ud.data().tenantId; setCurrentTenantId(tenantId); }
                }
                if (!tenantId) { document.getElementById('table-container').innerHTML = '<div class="empty-state">Nessun tenant</div>'; return; }
                await loadCategorie(tenantId);
                document.getElementById('btn-nuovo').onclick = openModal;
                document.getElementById('btn-close-modal').onclick = closeModal;
                document.getElementById('btn-annulla').onclick = closeModal;
                document.getElementById('filter-search').oninput = renderTable;
                document.getElementById('form-nuovo').onsubmit = async (e) => {
                    e.preventDefault();
                    const nome = document.getElementById('nome').value.trim();
                    const categoriaId = document.getElementById('categoriaId').value;
                    const cavalliMinimiRichiesti = parseFloat(document.getElementById('cavalliMinimiRichiesti').value);
                    if (!nome || nome.length < 3) { showAlert('Nome almeno 3 caratteri', 'error'); return; }
                    if (!categoriaId) { showAlert('Seleziona una categoria', 'error'); return; }
                    if (!cavalliMinimiRichiesti || cavalliMinimiRichiesti <= 0) { showAlert('Cavalli minimi obbligatori', 'error'); return; }
                    try {
                        await createMacchina({ nome, tipoMacchina: 'attrezzo', categoriaId, cavalliMinimiRichiesti }, user.uid);
                        showAlert('Attrezzatura aggiunta', 'success');
                        closeModal();
                        await loadData();
                    } catch (err) { showAlert(err.message || 'Errore salvataggio', 'error'); }
                };
                await loadData();
            });
        })();
    </script>
</body>
</html>
