<!DOCTYPE html>
<html lang="it">
<head>
<script>try{if(sessionStorage.getItem("gfv-pelle-turn")==="1"&&!/field-workspace|login-standalone|registrazione|reset-password|simulator-dev|prodotti-test|terreni-test|\/dev\//.test(location.pathname))document.documentElement.setAttribute("data-pelle","proposta")}catch(e){}</script>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elenco Flotta Aziendale - Parco Macchine - GFV Platform</title>
    <link rel="stylesheet" href="../../../core/styles/responsive-standalone.css">
    <link rel="stylesheet" href="../../../core/styles/list-views.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <div>
                <h1>🚚 Flotta Aziendale</h1>
                <p style="opacity: 0.9; margin-top: 4px; font-size: 14px;">Automezzi, veicoli e furgoni</p>
            </div>
            <div class="header-actions">
                <button type="button" class="btn btn-primary" id="btn-nuovo">➕ Nuovo Mezzo</button>
                <a href="macchine-dashboard-standalone.html" class="btn btn-secondary">← Dashboard</a>
            </div>
        </div>
        <div class="content">
            <div id="alert-container"></div>
            <div class="filters">
                <div class="filter-group">
                    <label>Cerca</label>
                    <input type="text" id="filter-search" placeholder="Nome, targa, marca...">
                </div>
            </div>
            <div class="section-header">
                <h2>Flotta</h2>
                <span id="count-label">0 mezzi</span>
            </div>
            <div id="table-container" class="table-responsive">
                <div class="loading">Caricamento...</div>
            </div>
        </div>
    </div>

    <div id="modal-nuovo" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Nuovo Mezzo (Flotta)</h3>
                <button type="button" class="close-btn" id="btn-close-modal">&times;</button>
            </div>
            <form id="form-nuovo">
                <div class="form-group">
                    <label for="nome">Nome *</label>
                    <input type="text" id="nome" required placeholder="es. Furgone Fiat Ducato" minlength="3">
                </div>
                <div class="form-group">
                    <label for="tipoMacchina">Tipo *</label>
                    <select id="tipoMacchina" required>
                        <option value="automezzo">Automezzo</option>
                        <option value="veicolo">Veicolo</option>
                        <option value="furgone">Furgone</option>
                    </select>
                </div>
                <div style="display: flex; gap: 10px; justify-content: flex-end; margin-top: 20px;">
                    <button type="button" class="btn btn-secondary" id="btn-annulla">Annulla</button>
                    <button type="submit" class="btn btn-primary">Salva</button>
                </div>
            </form>
        </div>
    </div>

    <script>window.currentTableData = window.currentTableData || { pageType: 'flotta', summary: 'Caricamento dati in corso...', items: [] };</script>
    <script type="module" src="../../../core/js/standalone-bootstrap.js" data-config-base="../../../core"></script>
    <script type="module">
        (async function() {
            try {
                await window.GFVStandaloneReady;
            } catch (err) {
                console.error('[flotta] Bootstrap failed:', err);
                throw err;
            }
            if (!window.currentTableData || !window.currentTableData.summary || window.currentTableData.summary === '') {
                window.currentTableData = { pageType: 'flotta', summary: 'Caricamento dati in corso...', items: [] };
            }
            const { getAuthInstance, getDb, getDoc, doc } = await import('../../../core/services/firebase-service.js');
            const { resolveAuthUser, loginPageUrl } = await import('../../../core/js/simulator-standalone-page.js');
            const { getCurrentTenantId, setCurrentTenantId } = await import('../../../core/services/tenant-service.js');
            const { getAllMacchine, createMacchina } = await import('../../parco-macchine/services/macchine-service.js');
            const { escapeHtml, showAlert } = await import('../../../core/js/gfv-page-utils.js');
            const auth = getAuthInstance();
            const db = getDb();

            let list = [];
            const TIPI_FLOTTA = ['automezzo', 'veicolo', 'furgone'];
            function tipoLabel(t) {
                const v = (t || '').toLowerCase();
                if (v === 'automezzo') return 'Automezzo';
                if (v === 'veicolo') return 'Veicolo';
                if (v === 'furgone') return 'Furgone';
                return escapeHtml(t || '-');
            }
            function statoBadge(s) {
                const v = (s || '').toLowerCase();
                if (v === 'disponibile') return '<span class="badge badge-disponibile">Disponibile</span>';
                if (v === 'in_uso') return '<span class="badge badge-in-uso">In uso</span>';
                return escapeHtml(s || '-');
            }

            function filterList() {
                const q = (document.getElementById('filter-search').value || '').toLowerCase();
                return list.filter(m => !q || (m.nome || '').toLowerCase().includes(q) || (m.targa || '').toLowerCase().includes(q) || (m.marca || '').toLowerCase().includes(q));
            }

            function renderTable() {
                const filtered = filterList();
                document.getElementById('count-label').textContent = filtered.length + ' mezzi';
                const container = document.getElementById('table-container');
                window.currentTableData = {
                    pageType: 'flotta',
                    summary: filtered.length === 0 ? 'Nessun mezzo in flotta.' : 'Ci sono ' + filtered.length + ' mezzi in flotta aziendale.',
                    items: filtered.map(m => ({
                        nome: m.nome || '-',
                        tipo: tipoLabel(m.tipoMacchina || m.tipo),
                        targa: m.targa || '-',
                        km: m.kmAttuali != null ? m.kmAttuali : m.kmIniziali,
                        stato: m.stato || '-'
                    }))
                };
                if (window.Tony && typeof window.Tony.setContext === 'function') {
                    window.Tony.setContext('page', Object.assign({}, window.Tony.context && window.Tony.context.page || {}, { tableDataSummary: window.currentTableData.summary, currentTableData: window.currentTableData }));
                }
                try { window.dispatchEvent(new CustomEvent('table-data-ready', { detail: { currentTableData: window.currentTableData } })); } catch (e) {}
                if (filtered.length === 0) {
                    container.innerHTML = '<div class="empty-state">Nessun automezzo aziendale registrato</div>';
                    return;
                }
                container.innerHTML = '<table class="mezzi-table"><thead><tr><th>Nome</th><th>Tipo</th><th>Targa</th><th>Km</th><th>Stato</th></tr></thead><tbody>' +
                    filtered.map(m => {
                        const km = m.kmAttuali != null ? m.kmAttuali : m.kmIniziali;
                        return '<tr><td>' + escapeHtml(m.nome || '-') + '</td><td>' + tipoLabel(m.tipoMacchina || m.tipo) + '</td><td>' + escapeHtml(m.targa || '-') + '</td><td>' + (km != null ? Number(km).toLocaleString('it-IT') : '-') + '</td><td>' + statoBadge(m.stato) + '</td></tr>';
                    }).join('') + '</tbody></table>';
            }

            function openModal() { document.getElementById('modal-nuovo').classList.add('active'); }
            function closeModal() { document.getElementById('modal-nuovo').classList.remove('active'); document.getElementById('form-nuovo').reset(); }

            async function loadData() {
                const container = document.getElementById('table-container');
                container.innerHTML = '<div class="loading">Caricamento...</div>';
                try {
                    const macchine = await getAllMacchine({ soloAttive: false });
                    list = (macchine || []).filter(m => TIPI_FLOTTA.includes((m.tipoMacchina || m.tipo || '').toLowerCase()));
                    renderTable();
                } catch (err) {
                    console.error(err);
                    showAlert('Errore: ' + err.message, 'error');
                    container.innerHTML = '<div class="empty-state">Errore caricamento</div>';
                }
            }

            auth.onAuthStateChanged(async (user) => {
                if (!user) user = await resolveAuthUser(auth);
                if (!user) { window.location.href = await loginPageUrl('../../../core/auth/login-standalone.html'); return; }
                let tenantId = getCurrentTenantId();
                if (!tenantId) {
                    const ud = await getDoc(doc(db, 'users', user.uid));
                    if (ud.exists() && ud.data().tenantId) { tenantId = ud.data().tenantId; setCurrentTenantId(tenantId); }
                }
                if (!tenantId) { document.getElementById('table-container').innerHTML = '<div class="empty-state">Nessun tenant</div>'; return; }
                document.getElementById('btn-nuovo').onclick = openModal;
                document.getElementById('btn-close-modal').onclick = closeModal;
                document.getElementById('btn-annulla').onclick = closeModal;
                document.getElementById('filter-search').oninput = renderTable;
                document.getElementById('form-nuovo').onsubmit = async (e) => {
                    e.preventDefault();
                    const nome = document.getElementById('nome').value.trim();
                    const tipoMacchina = document.getElementById('tipoMacchina').value;
                    if (!nome || nome.length < 3) { showAlert('Nome almeno 3 caratteri', 'error'); return; }
                    try {
                        await createMacchina({ nome, tipoMacchina }, user.uid);
                        showAlert('Mezzo aggiunto', 'success');
                        closeModal();
                        await loadData();
                    } catch (err) { showAlert(err.message || 'Errore salvataggio', 'error'); }
                };
                await loadData();
            });
        })();
    </script>
</body>
</html>
