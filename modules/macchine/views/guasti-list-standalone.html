    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Elenco Guasti - Parco Macchine - GFV Platform</title>
    <link rel="stylesheet" href="../../../core/styles/responsive-standalone.css">
    <link rel="stylesheet" href="../../../core/styles/list-views.css">
    <style>
        .filter-group select { min-width: 180px; }
        .badge-grave { background: #c62828; color: white; }
        .badge-non-grave { background: #f9a825; color: #000; }
        .badge-risolto { background: #2e7d32; color: white; }
        .badge-annullato { background: #757575; color: white; }
        .badge-approvato { background: #00838f; color: white; }
        .badge-in-attesa { background: #1565c0; color: white; }
        .badge-sospeso { background: #6a1b9a; color: white; }
        .modal-content { max-width: 440px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div>
                <h1>⚠️ Officina & Guasti</h1>
                <p style="opacity: 0.9; margin-top: 4px; font-size: 14px;">Segnalazioni dagli operai – segna come risolto</p>
            </div>
            <div class="header-actions">
                <a href="../../../core/admin/segnalazione-guasti-standalone.html" class="btn btn-primary">➕ Segnala guasto</a>
                <a href="macchine-dashboard-standalone.html" class="btn btn-secondary">← Dashboard</a>
            </div>
        </div>
        <div class="content">
            <div id="alert-container"></div>
            <div class="filters">
                <div class="filter-group">
                    <label>Stato</label>
                    <select id="filter-stato">
                        <option value="aperti">Solo aperti</option>
                        <option value="tutti">Tutti</option>
                    </select>
                </div>
            </div>
            <div class="section-header">
                <h2>Elenco guasti</h2>
                <span id="count-label">0 guasti</span>
            </div>
            <div id="table-container" class="table-responsive">
                <div class="loading">Caricamento...</div>
            </div>
        </div>
    </div>

    <div id="modal-risolvi" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Segna come risolto</h3>
                <button type="button" class="close-btn" id="btn-close-modal">&times;</button>
            </div>
            <form id="form-risolvi">
                <input type="hidden" id="risolvi-guasto-id">
                <div class="form-group">
                    <label for="risolvi-note">Note risoluzione (opzionale)</label>
                    <textarea id="risolvi-note" placeholder="Es. intervento effettuato, ricambio sostituito..."></textarea>
                </div>
                <div style="display: flex; gap: 10px; justify-content: flex-end; margin-top: 20px;">
                    <button type="button" class="btn btn-secondary" id="btn-annulla">Annulla</button>
                    <button type="submit" class="btn btn-success">Segna risolto</button>
                </div>
            </form>
        </div>
    </div>

    <script>window.currentTableData = window.currentTableData || { pageType: 'guasti', summary: 'Caricamento dati in corso...', items: [] };</script>
    <script type="module" src="../../../core/js/standalone-bootstrap.js" data-config-base="../../../core"></script>
    <script type="module">
        import { formatDateTimeItalianReadable } from '../../../core/js/date-format-it.js';
        (async function() {
            try {
                await window.GFVStandaloneReady;
            } catch (err) {
                console.error('[guasti] Bootstrap failed:', err);
                throw err;
            }
            if (!window.currentTableData || !window.currentTableData.summary || window.currentTableData.summary === '') {
                window.currentTableData = { pageType: 'guasti', summary: 'Caricamento dati in corso...', items: [] };
            }
            const { getAuthInstance, getDb, getDoc, doc, updateDoc, collection, onSnapshot, query, orderBy, deleteField, runTransaction } = await import('../../../core/services/firebase-service.js');
            const { resolveAuthUser, loginPageUrl } = await import('../../../core/js/simulator-standalone-page.js');
            const { getCurrentTenantId, setCurrentTenantId } = await import('../../../core/services/tenant-service.js');
            const { getAllMacchine } = await import('../../parco-macchine/services/macchine-service.js');
            const { escapeHtml, showAlert } = await import('../../../core/js/gfv-page-utils.js');
            const {
                esitoRipresaDopoGuasto,
                buildRiprendiLavoroPatch,
                patchRipresaPerFirestore,
                testoToastRipresa,
                mostraRiprendiLavoro,
                statoDopoRipresa
            } = await import('../../../core/services/lavoro-ripresa-guasto.js');
            const { isGuastoAttivo, isGuastoChiuso, chiaveBadgeStatoGuasto } = await import('../../../core/services/guasto-stati.js');
            const { aggiungiVoceStorico, buildVoceStorico } = await import('../../../core/services/guasto-storico.js');
            const { mezziDaRipristinare, statoRipristinoMezzo, altroGuastoAttivoSulMezzo } = await import('../../../core/services/guasto-ripristino.js');
            const auth = getAuthInstance();
            const db = getDb();

            let guastiList = [];
            let macchineList = [];
            const lavoriById = new Map();
            function formatDate(val) {
                return formatDateTimeItalianReadable(val);
            }
            function getMacchinaNome(macchinaId) {
                const m = macchineList.find(x => x.id === macchinaId);
                return m ? (m.nome || macchinaId) : (macchinaId || '—');
            }
            function statoBadge(stato) {
                const chiave = chiaveBadgeStatoGuasto(stato);
                if (chiave === 'risolto') return '<span class="badge badge-risolto">Risolto</span>';
                if (chiave === 'annullato') return '<span class="badge badge-annullato">Annullato</span>';
                if (chiave === 'approvato-continuazione') return '<span class="badge badge-approvato">Continuazione approvata</span>';
                if (chiave === 'sospeso') return '<span class="badge badge-sospeso">Sospeso</span>';
                if (chiave === 'in-attesa') return '<span class="badge badge-in-attesa">Aperto</span>';
                return '<span class="badge">' + escapeHtml(String(stato == null ? '' : stato)) + '</span>';
            }
            function gravitaBadge(gravita) {
                return (gravita || '').toLowerCase() === 'grave'
                    ? '<span class="badge badge-grave">Grave</span>'
                    : '<span class="badge badge-non-grave">Non grave</span>';
            }

            function isGuastoAperto(g) {
                return isGuastoAttivo(g && g.stato);
            }
            function filterList() {
                const soloAperti = document.getElementById('filter-stato').value === 'aperti';
                return soloAperti ? guastiList.filter(isGuastoAperto) : guastiList;
            }

            function renderTable() {
                const filtered = filterList();
                const guastiApertiCount = guastiList.filter(isGuastoAperto).length;
                const aperti = guastiList.filter(isGuastoAperto);
                const gravi = aperti.filter(g => (g.gravita || '').toLowerCase() === 'grave');
                const risolti = filtered.filter(g => !isGuastoAperto(g)).length;
                const N = guastiList.length;
                const summary = 'Ci sono ' + N + ' guasti registrati, di cui ' + guastiApertiCount + ' ancora aperti.';
                window.currentTableData = {
                    pageType: 'guasti',
                    summary: summary,
                    guastiApertiCount: guastiApertiCount,
                    items: filtered.map(g => ({
                        macchina: g.tipoGuasto === 'generico' ? (g.ubicazione || '—') : getMacchinaNome(g.macchinaId),
                        descrizione: g.tipoGuasto === 'generico' ? (g.tipoProblema || 'Segnalazione') : (g.dettagli || getMacchinaNome(g.macchinaId) || '—'),
                        dataSegnalazione: formatDate(g.segnalatoIl),
                        priorita: (g.gravita || '').toLowerCase() === 'grave' ? 'grave' : 'non grave'
                    }))
                };
                if (window.Tony && typeof window.Tony.setContext === 'function') {
                    window.Tony.setContext('page', Object.assign({}, window.Tony.context && window.Tony.context.page || {}, { tableDataSummary: window.currentTableData.summary, currentTableData: window.currentTableData }));
                }
                try { window.dispatchEvent(new CustomEvent('table-data-ready', { detail: { currentTableData: window.currentTableData } })); } catch (e) {}
                if (guastiApertiCount > 0 && !window.tonyGuastiAlertFired && window.Tony && typeof window.Tony.speak === 'function') {
                    setTimeout(function() {
                        if (guastiApertiCount > 0 && !window.tonyGuastiAlertFired) {
                            window.tonyGuastiAlertFired = true;
                            window.Tony.speak('Ti ricordo che ci sono ' + guastiApertiCount + ' guasti aperti che richiedono la tua attenzione.');
                        }
                    }, 4000);
                }
                document.getElementById('count-label').textContent = filtered.length + ' guasti' + (aperti.length > 0 ? ' (' + aperti.length + ' aperti)' : '');
                const container = document.getElementById('table-container');
                if (filtered.length === 0) {
                    container.innerHTML = '<div class="empty-state">Nessun guasto trovato</div>';
                    return;
                }
                const rows = filtered.map(g => {
                    const titolo = g.tipoGuasto === 'generico' ? (g.tipoProblema || 'Segnalazione') + ' – ' + (g.ubicazione || '') : getMacchinaNome(g.macchinaId);
                    const attivo = isGuastoAttivo(g.stato);
                    const lavoroNota = g.lavoroId ? lavoriById.get(g.lavoroId) : null;
                    const btnRiprendi = mostraRiprendiLavoro(g, lavoroNota)
                        ? '<button type="button" class="btn btn-primary btn-riprendi" id="btn-riprendi-lavoro-' + escapeHtml(g.id) + '" data-id="' + escapeHtml(g.id) + '">Riprendi lavoro</button>'
                        : '';
                    const btnRisolvi = attivo
                        ? '<button type="button" class="btn btn-success btn-risolvi" data-id="' + escapeHtml(g.id) + '">Segna risolto</button>'
                        : btnRiprendi;
                    return '<tr><td>' + escapeHtml(titolo) + '</td><td>' + gravitaBadge(g.gravita) + '</td><td>' + escapeHtml(formatDate(g.segnalatoIl)) + '</td><td>' + statoBadge(g.stato) + '</td><td>' + (g.dettagli ? escapeHtml(String(g.dettagli).slice(0, 60)) + (String(g.dettagli).length > 60 ? '…' : '') : '—') + '</td><td>' + btnRisolvi + '</td></tr>';
                }).join('');
                container.innerHTML = '<table class="guasti-table"><thead><tr><th>Mezzo / Descrizione</th><th>Gravità</th><th>Segnalato il</th><th>Stato</th><th>Dettagli</th><th></th></tr></thead><tbody>' + rows + '</tbody></table>';
                container.querySelectorAll('.btn-risolvi').forEach(btn => {
                    btn.onclick = () => openRisolviModal(btn.dataset.id);
                });
                container.querySelectorAll('.btn-riprendi').forEach(btn => {
                    btn.onclick = () => riprendiLavoroDaGuasto(btn.dataset.id);
                });
                aggiornaCacheLavoriSospesi();
            }

            function openRisolviModal(guastoId) {
                document.getElementById('risolvi-guasto-id').value = guastoId || '';
                document.getElementById('risolvi-note').value = '';
                document.getElementById('modal-risolvi').classList.add('active');
            }
            function closeModal() {
                document.getElementById('modal-risolvi').classList.remove('active');
                document.getElementById('form-risolvi').reset();
            }

            async function scriviRipresaLavoro(lavoro, lavoroRef) {
                const patch = buildRiprendiLavoroPatch(lavoro, new Date());
                await updateDoc(lavoroRef, patchRipresaPerFirestore(patch, deleteField));
                lavoriById.set(lavoro.id, {
                    ...lavoro,
                    stato: statoDopoRipresa(lavoro),
                    sospensioneCausa: null,
                    sospensioneIl: null
                });
            }

            function guastiPerDecisione(guastoId) {
                return guastiList.map((g) => (g.id === guastoId ? { ...g, stato: 'risolto' } : g));
            }

            async function esitoRipresaGuasto(guastoId, guastoData) {
                if (!guastoData.lavoroId) return { tipo: 'nessuno' };
                const tenantId = getCurrentTenantId();
                const lavoroRef = doc(db, 'tenants', tenantId, 'lavori', guastoData.lavoroId);
                const lavoroSnap = await getDoc(lavoroRef);
                if (!lavoroSnap.exists()) return { tipo: 'nessuno' };
                const lavoro = { id: lavoroSnap.id, ...lavoroSnap.data() };
                const esito = esitoRipresaDopoGuasto({
                    lavoro,
                    guasti: guastiPerDecisione(guastoId),
                    guastoId
                });
                if (!esito.riprendi && esito.motivo !== 'altro-guasto') return { tipo: 'nessuno', lavoro };
                if (esito.motivo === 'altro-guasto') {
                    lavoriById.set(lavoro.id, lavoro);
                    return { tipo: 'altro', lavoro };
                }
                try {
                    await scriviRipresaLavoro(lavoro, lavoroRef);
                    return { tipo: 'ripreso', lavoro };
                } catch (err) {
                    console.warn('[guasti] ripresa lavoro:', err);
                    lavoriById.set(lavoro.id, lavoro);
                    return { tipo: 'fallita', lavoro };
                }
            }

            function messaggioDaEsitoRipresa(esito) {
                if (!esito || esito.tipo === 'nessuno') return 'Guasto segnato come risolto.';
                const nome = (esito.lavoro && esito.lavoro.nome) || '';
                if (esito.tipo === 'ripreso') return testoToastRipresa(nome, { ripreso: true });
                if (esito.tipo === 'altro') return testoToastRipresa(nome, { altroGuasto: true });
                return testoToastRipresa(nome, { fallita: true });
            }

            let ripresaFetchToken = 0;
            async function aggiornaCacheLavoriSospesi() {
                const tenantId = getCurrentTenantId();
                if (!tenantId) return;
                const ids = [];
                guastiList.forEach((g) => {
                    if (g.lavoroId && isGuastoChiuso(g.stato) && !lavoriById.has(g.lavoroId)) {
                        if (ids.indexOf(g.lavoroId) < 0) ids.push(g.lavoroId);
                    }
                });
                if (!ids.length) return;
                const token = ++ripresaFetchToken;
                for (let i = 0; i < ids.length; i += 1) {
                    try {
                        const snap = await getDoc(doc(db, 'tenants', tenantId, 'lavori', ids[i]));
                        if (token !== ripresaFetchToken) return;
                        lavoriById.set(ids[i], snap.exists() ? { id: snap.id, ...snap.data() } : { id: ids[i], stato: '' });
                    } catch (err) {
                        console.warn('[guasti] lettura lavoro per ripresa:', err);
                        lavoriById.set(ids[i], { id: ids[i], stato: '' });
                    }
                }
                if (token === ripresaFetchToken) renderTable();
            }

            async function riprendiLavoroDaGuasto(guastoId) {
                const guasto = guastiList.find((g) => g.id === guastoId);
                if (!guasto || !guasto.lavoroId) {
                    showAlert('Non trovo il lavoro collegato a questo guasto.', 'error');
                    return;
                }
                try {
                    const esito = await esitoRipresaGuasto(guastoId, { ...guasto, stato: 'risolto' });
                    showAlert(messaggioDaEsitoRipresa(esito), esito.tipo === 'fallita' ? 'warning' : 'success');
                    renderTable();
                } catch (err) {
                    console.warn('[guasti] Riprendi lavoro:', err);
                    showAlert('Guasto risolto, ma non ho potuto riprendere il lavoro: riprendilo da Gestione lavori.', 'error');
                }
            }

            async function segnaRisolto(guastoId, noteRisoluzione) {
                const tenantId = getCurrentTenantId();
                if (!tenantId) throw new Error('Nessun tenant');
                const guastoRef = doc(db, 'tenants', tenantId, 'guasti', guastoId);
                let esitoChiusura = 'ok';
                let guastoData = null;
                await runTransaction(db, async (tx) => {
                    const snap = await tx.get(guastoRef);
                    if (!snap.exists() || !isGuastoAttivo(snap.data().stato)) {
                        esitoChiusura = 'chiuso';
                        return;
                    }
                    const data = snap.data();
                    const now = new Date();
                    guastoData = { id: snap.id, ...data };
                    tx.update(guastoRef, {
                        stato: 'risolto',
                        risolto: true,
                        risoltoDa: auth.currentUser.uid,
                        risoltoIl: now,
                        noteRisoluzione: noteRisoluzione || null,
                        storico: aggiungiVoceStorico(data.storico, buildVoceStorico({
                            azione: 'chiuso_manager',
                            uid: auth.currentUser.uid,
                            now,
                            nota: noteRisoluzione
                        })),
                        updatedAt: now
                    });
                });
                if (esitoChiusura !== 'ok' || !guastoData) {
                    throw new Error('Questo guasto è già stato chiuso.');
                }
                let mezzoFallito = false;
                const mezzi = mezziDaRipristinare(guastoData);
                for (let i = 0; i < mezzi.length; i += 1) {
                    const mezzo = mezzi[i];
                    try {
                        const mezzoRef = doc(db, 'tenants', tenantId, 'macchine', mezzo.id);
                        const mezzoSnap = await getDoc(mezzoRef);
                        if (!mezzoSnap.exists()) continue;
                        const decisione = statoRipristinoMezzo({
                            statoAttuale: mezzoSnap.data().stato,
                            statoPrima: mezzo.statoPrima,
                            altroGuastoAttivoSulMezzo: altroGuastoAttivoSulMezzo(guastiPerDecisione(guastoId), mezzo.id, guastoId)
                        });
                        if (!decisione.scrivi) continue;
                        await updateDoc(mezzoRef, { stato: decisione.stato, updatedAt: new Date() });
                    } catch (err) {
                        console.warn('[guasti] ripristino mezzo:', err);
                        mezzoFallito = true;
                    }
                }
                if (mezzoFallito) {
                    showAlert('Guasto risolto, ma non ho potuto aggiornare lo stato del mezzo: controllalo in Parco macchine.', 'warning');
                }
                let esito = { tipo: 'nessuno' };
                if (guastoData.lavoroId) {
                    try {
                        esito = await esitoRipresaGuasto(guastoId, guastoData);
                    } catch (err) {
                        console.warn('[guasti] ripresa dopo risoluzione:', err);
                        esito = { tipo: 'fallita', lavoro: { nome: '' } };
                    }
                }
                return messaggioDaEsitoRipresa(esito);
            }

            function setupGuastiListener(tenantId) {
                const guastiRef = collection(db, 'tenants', tenantId, 'guasti');
                let q;
                try { q = query(guastiRef, orderBy('segnalatoIl', 'desc')); } catch (_) { q = guastiRef; }
                return onSnapshot(q, (snap) => {
                    guastiList = [];
                    snap.forEach(d => guastiList.push({ id: d.id, ...d.data() }));
                    if (!snap.query || !snap.query.orderBy) guastiList.sort((a, b) => {
                        const ta = a.segnalatoIl?.toDate ? a.segnalatoIl.toDate().getTime() : (a.segnalatoIl ? new Date(a.segnalatoIl).getTime() : 0);
                        const tb = b.segnalatoIl?.toDate ? b.segnalatoIl.toDate().getTime() : (b.segnalatoIl ? new Date(b.segnalatoIl).getTime() : 0);
                        return tb - ta;
                    });
                    renderTable();
                }, (err) => {
                    console.error('Listener guasti:', err);
                    document.getElementById('table-container').innerHTML = '<div class="empty-state">Errore caricamento guasti</div>';
                });
            }

            auth.onAuthStateChanged(async (user) => {
                if (!user) user = await resolveAuthUser(auth);
                if (!user) { window.location.href = await loginPageUrl('../../../core/auth/login-standalone.html'); return; }
                let tenantId = getCurrentTenantId();
                if (!tenantId) {
                    const ud = await getDoc(doc(db, 'users', user.uid));
                    if (ud.exists() && ud.data().tenantId) { tenantId = ud.data().tenantId; setCurrentTenantId(tenantId); }
                }
                if (!tenantId) { document.getElementById('table-container').innerHTML = '<div class="empty-state">Nessun tenant</div>'; return; }
                try {
                    macchineList = await getAllMacchine({ soloAttive: false });
                } catch (_) { macchineList = []; }
                document.getElementById('filter-stato').onchange = renderTable;
                document.getElementById('btn-close-modal').onclick = closeModal;
                document.getElementById('btn-annulla').onclick = closeModal;
                document.getElementById('form-risolvi').onsubmit = async (e) => {
                    e.preventDefault();
                    const submitBtn = e.submitter || e.target.querySelector('button[type="submit"]');
                    const guastoId = document.getElementById('risolvi-guasto-id').value;
                    const note = document.getElementById('risolvi-note').value.trim() || null;
                    if (!guastoId) return;
                    if (submitBtn) submitBtn.disabled = true;
                    try {
                        const messaggio = await segnaRisolto(guastoId, note);
                        showAlert(messaggio, messaggio.indexOf('non ho potuto') >= 0 ? 'warning' : 'success');
                        closeModal();
                        renderTable();
                    } catch (err) {
                        showAlert(err.message || 'Errore aggiornamento', 'error');
                    } finally {
                        if (submitBtn) submitBtn.disabled = false;
                    }
                };
                const container = document.getElementById('table-container');
                container.innerHTML = '<div class="loading">Caricamento guasti...</div>';
                setupGuastiListener(tenantId);
            });
        })();
    </script>
    <!-- Service Worker: la barra di aggiornamento sta in app-update.js -->
    <script type="module">
        import { registraServiceWorker } from '../../../core/js/app-update.js?v=2026-10-21a';
        const swPath = window.location.pathname.includes('/gfv-platform/')
            ? '/gfv-platform/service-worker.js'
            : '../../../service-worker.js';
        registraServiceWorker(swPath);
    </script>
