name: GFV Farm Simulator CI

on:
  push:
    branches: [main, develop]
    paths:
      # Controlli veloci sul codice servito al browser.
      # Gli E2E non girano qui: 84 spec Playwright e il mock Tony stanno in npm run test:promote.
      # (prima i job citavano «71 spec» e «16 scenari», numeri superati)
      - 'core/**'
      - 'modules/**'
      - 'shared/**'
      - 'index.html'
      - 'service-worker.js'
      - 'sw-strategy.js'
      - 'manifest.json'
      - 'functions/**'
      - 'landing/**'
      - 'simulator/**'
      - 'tests/**'
      - 'scripts/**'
      - 'playwright.config.js'
      - 'vitest.config.js'
      - 'firebase.json'
      - '.firebaserc'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/simulator-ci.yml'
  pull_request:
    paths:
      # Controlli veloci sul codice servito al browser.
      # Gli E2E non girano qui: 84 spec Playwright e il mock Tony stanno in npm run test:promote.
      # (prima i job citavano «71 spec» e «16 scenari», numeri superati)
      - 'core/**'
      - 'modules/**'
      - 'shared/**'
      - 'index.html'
      - 'service-worker.js'
      - 'sw-strategy.js'
      - 'manifest.json'
      - 'functions/**'
      - 'landing/**'
      - 'simulator/**'
      - 'tests/**'
      - 'scripts/**'
      - 'playwright.config.js'
      - 'vitest.config.js'
      - 'firebase.json'
      - '.firebaserc'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/simulator-ci.yml'
  workflow_dispatch:
  # schedule spento: riattivare quando il seed lab-trimestre-full sarà sistemato
  # schedule:
  #   - cron: '0 2 * * *'

permissions:
  contents: read

concurrency:
  group: simulator-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-import-guard:
    name: import-guard (import relativi risolvibili)
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Import relativi (core/, modules/, shared/) + handler functions/index.js
        run: npx vitest run tests/relative-imports-resolve.test.js tests/functions-index-handlers-defined.test.js tests/auth-form-query-guard.test.js tests/sede-map-init-order.test.js tests/versioned-imports-consistency.test.js tests/app-update.test.js tests/gestione-lavori-statistiche-card.test.js tests/published-no-node-modules.test.js tests/moduli-identificatori-definiti.test.js

  pwa-cache-id-guard:
    name: SW_CACHE_BUILD_ID se la PR cambia il sito
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build id nuovo se cambiano core, modules, shared, index.html o sw-strategy.js
        run: |
          set -euo pipefail
          BASE="${{ github.event.pull_request.base.sha }}"
          git diff --name-only "$BASE" HEAD > /tmp/gfv-changed.txt
          if grep -Eq '^(core/|modules/|shared/|index\.html$|sw-strategy\.js$)' /tmp/gfv-changed.txt; then
            OLD=$(git show "$BASE:service-worker.js" | sed -n "s/^const SW_CACHE_BUILD_ID = '\\([^']*\\)';/\\1/p")
            NEW=$(sed -n "s/^const SW_CACHE_BUILD_ID = '\\([^']*\\)';/\\1/p" service-worker.js)
            echo "base=$OLD head=$NEW"
            if [ -z "$OLD" ] || [ -z "$NEW" ]; then
              echo "SW_CACHE_BUILD_ID illeggibile"
              exit 1
            fi
            if [ "$OLD" = "$NEW" ]; then
              echo "La PR cambia il sito ma SW_CACHE_BUILD_ID è rimasto $NEW"
              exit 1
            fi
          else
            echo "Nessun file del sito: il build id può restare uguale"
          fi

  simulator-emulator:
    name: sim:test (Auth + Firestore emulator)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Setup Java (Firestore Emulator)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: npm ci

      - name: Run simulator integration tests (v1, v2, stack completo)
        run: npm run sim:test:ci

  simulator-tony-vitest:
    name: sim:tony:vitest (Tony tier 1 matrix)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install functions dependencies
        run: npm ci
        working-directory: functions

      - name: Generate Tony config JSON
        run: node functions/scripts/generate-tony-configs.js

      - name: Run Tony Vitest (matrix typo/forbidden + suite)
        run: npm run sim:tony:vitest

  allenatore-landing-vitest:
    name: allenatore landing (Vitest)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Pacchetto landing + suite landing (solo Vitest)
        run: npm run sim:allenatore:vitest
