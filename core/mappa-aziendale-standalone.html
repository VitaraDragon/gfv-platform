<!DOCTYPE html>
<html lang="it" data-gfv-pelle-host="1" data-gfv-pelle-place="Mappa">
<head>
<script>try{if(!/field-workspace|login-standalone|registrazione|reset-password|simulator-dev|prodotti-test|terreni-test|\/dev\//.test(location.pathname))document.documentElement.setAttribute("data-pelle","proposta")}catch(e){}</script>

    <script>window.GFV_TOUR_DISABLED = true;</script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Mappa aziendale - GFV Platform</title>
    <link rel="manifest" href="../manifest.json">
    <meta name="theme-color" content="#2E8B57">
    <link rel="stylesheet" href="styles/dashboard.css">
    <link rel="stylesheet" href="styles/manodopera-semaforo.css">
    <link rel="stylesheet" href="styles/responsive-standalone.css">
    <style>
        html, body {
            height: 100%;
        }
        .mappa-page-shell {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        .mappa-page-shell .dashboard-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-height: 0;
        }
        #mappa-page-root {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-height: 0;
        }
        .mappa-page-map-section.dashboard-section {
            flex: 1;
            min-height: 0;
            margin-bottom: 0;
        }
        #mappa-aziendale-container {
            flex: 1 !important;
            min-height: min(72vh, 800px) !important;
        }
    </style>
</head>
<body>
    <div class="dashboard-container mappa-page-shell">
        <div class="dashboard-header">
            <div>
                <h1>🗺️ Mappa aziendale</h1>
                <div class="user-info" id="mappa-user-info">Caricamento…</div>
            </div>
            <div class="header-actions">
                <a href="dashboard-standalone.html" class="btn btn-primary" style="text-decoration: none; display: inline-flex; align-items: center; gap: 8px;">
                    <span>←</span>
                    <span>Dashboard</span>
                </a>
                <button type="button" class="logout-button" id="mappa-logout-button">Logout</button>
            </div>
        </div>
        <div id="mappa-page-root">
            <div class="loading" style="padding: 40px; text-align: center;">Caricamento mappa…</div>
        </div>
    </div>

    <script src="js/dashboard-utils.js"></script>
    <script type="module" src="js/standalone-bootstrap.js" data-config-base=""></script>
    <script type="module">
        import { bootstrapMappaAziendalePage } from './js/mappa-aziendale-page.js';
        try {
            await window.GFVStandaloneReady;
        } catch (err) {
            console.error('[mappa-aziendale] Bootstrap failed:', err);
            var root = document.getElementById('mappa-page-root');
            if (root) {
                root.innerHTML = '<div class="dashboard-section" style="margin:24px;"><h3 style="color:#dc3545;">⚠️ Errore configurazione</h3><p>' + (err && err.message ? err.message : 'Config non disponibile') + '</p></div>';
            }
            throw err;
        }
        bootstrapMappaAziendalePage();
    </script>
</body>
</html>
