    <script type="module" src="../js/standalone-bootstrap.js" data-config-base="../"></script>
    <script type="module">
        import { formatDateLikeToItalianLongLocal } from '../js/date-format-it.js';
        import { formatPosizioneRilevamentoCompactHtml } from '../js/geo-capture.js';
        import { showAlert } from '../js/gfv-page-utils.js';
        import { resolveAuthUser, loginPageUrl } from '../js/simulator-standalone-page.js';

        try {
            await window.GFVStandaloneReady;
        } catch (err) {
            console.error('[validazione-ore] Bootstrap failed:', err);
            throw err;
        }

        import { getAppInstance, getAuthInstance, getDb } from '../services/firebase-service.js';
        import { collection, getDocs, doc, getDoc, query, where, orderBy, onSnapshot, updateDoc, serverTimestamp } from '../services/firebase-service.js';
        import { onAuthStateChanged } from '../services/firebase-service.js';
        import {
            oreVisibileInCodaValidazione,
            assertUtentePuoValidareOra,
            isLavoroAutonomo
        } from '../services/manodopera-ore-validazione-scope.js';
        import {
            getManodoperaDisplayNameFromMap,
            indexManodoperaUserInMap
        } from '../services/comunicazioni-squadra-utils.js';
        import {
            fetchLavoriWithOreOperai,
            forEachOraInBundle,
            normalizeOraRecordData
        } from '../services/manodopera-lavori-ore-loader.js';
        import { getDashboardCountsSnapshot } from '../js/dashboard-counts-snapshot.js';
        import {
            validaOraContesto,
            rifiutaOraContesto,
            correggiOra,
            annullaValidazioneOra,
            rifiutaOraValidata
        } from '../services/ore-service.js';
        import {
            permessiOra,
            formattaOreMinuti,
            sommaOreNette,
            chiaveGiornoOra,
            trovaSovrapposizioni,
            contaRigheConSovrapposizione,
            formatTracciaOra,
            oraVisibileInArchivioValidate
        } from '../services/ore-operai-logic.js';

        // Import service unificato macchine (solo se modulo attivo)
        let macchineUtilizzoService = null;
        if (typeof window !== 'undefined') {
            // Carica service dinamicamente quando necessario
            window.loadMacchineUtilizzoService = async function() {
                if (!macchineUtilizzoService) {
                    // Verifica se siamo in ambiente file:// (non supportato per moduli ES6)
                    const isFileProtocol = window.location.protocol === 'file:';
                    if (isFileProtocol) {
                        // In ambiente file://, i moduli ES6 non funzionano a causa di CORS
                        // L'applicazione continuerà a funzionare ma senza le funzionalità avanzate del service

                        return null;
                    }
                    
                    try {
                        const module = await import('../../modules/parco-macchine/services/macchine-utilizzo-service.js');
                        macchineUtilizzoService = module;
                        return module;
                    } catch (error) {
                        // Errore già gestito, non loggare se è un errore CORS in ambiente file://
                        if (!isFileProtocol) {
                            console.warn('Errore caricamento service macchine:', error);
                        }
                        return null;
                    }
                }
                return macchineUtilizzoService;
            };
        }

        const app = getAppInstance();
        const auth = getAuthInstance();
        const db = getDb();

        let currentUserData = null;
        let currentTenantId = null;
        let oreDaValidare = [];
        let oreValidateArchivio = [];
        let oreTuttePerSovrapposizione = [];
        let operaiMap = new Map();

        function utenteValidazione() {
            return {
                id: currentUserData.id || currentUserData.uid,
                uid: currentUserData.uid || currentUserData.id,
                ruoli: currentUserData.ruoli || []
            };
        }

        function flagValidazione() {
            const ruoli = currentUserData.ruoli || [];
            return {
                isCaposquadra: ruoli.includes('caposquadra'),
                isManager: ruoli.includes('manager') || ruoli.includes('amministratore'),
                userId: currentUserData.id || currentUserData.uid
            };
        }

        function setStatOre(id, righe) {
            const el = document.getElementById(id);
            if (!el) return;
            const lista = Array.isArray(righe) ? righe : [];
            el.setAttribute('data-righe', String(lista.length));
            const ore = formattaOreMinuti(sommaOreNette(lista));
            const parola = lista.length === 1 ? 'riga' : 'righe';
            el.innerHTML = `${ore}<small class="stat-righe">(${lista.length} ${parola})</small>`;
        }

        function nomeUtenteOra(uid) {
            if (!uid) return '';
            const nome = getManodoperaDisplayNameFromMap(operaiMap, uid);
            return nome && nome !== 'N/A' ? nome : '';
        }

        function giornoEntroUltimi30(dataLike) {
            const key = chiaveGiornoOra(dataLike);
            if (!key) return false;
            const limite = new Date();
            limite.setDate(limite.getDate() - 30);
            const limiteKey = chiaveGiornoOra(limite);
            return key >= limiteKey;
        }

        function mostraAvvisiMacchina(esito) {
            const avvisi = esito && esito.avvisi ? esito.avvisi.filter(Boolean) : [];
            if (avvisi.length) showAlert(avvisi[0], 'warning');
        }

        function seedKpiFromDashboardSnapshot() {
            const snap = getDashboardCountsSnapshot();
            if (!snap || snap.tenantId !== currentTenantId) return;
            if (typeof snap.oreDaValidare !== 'number') return;
            const el = document.getElementById('stat-da-validare');
            if (el) el.textContent = String(snap.oreDaValidare);
        }

        // Verifica autenticazione e permessi
        onAuthStateChanged(auth, async (user) => {
            if (!user) user = await resolveAuthUser(auth);
            if (!user) {
                window.location.href = await loginPageUrl('../auth/login-standalone.html');
                return;
            }

            try {
                // Carica dati utente
                const userDoc = await getDoc(doc(db, 'users', user.uid));
                if (userDoc.exists()) {
                    currentUserData = { ...userDoc.data(), id: user.uid, uid: user.uid };
                    try {
                        currentTenantId = sessionStorage.getItem('gfv_current_tenant_id') || currentUserData.tenantId;
                    } catch (_) {
                        currentTenantId = currentUserData.tenantId;
                    }

                    // Verifica permessi (caposquadra O manager/amministratore)
                    const isCaposquadra = currentUserData.ruoli && currentUserData.ruoli.includes('caposquadra');
                    const isManager = currentUserData.ruoli && (currentUserData.ruoli.includes('manager') || currentUserData.ruoli.includes('amministratore'));
                    
                    if (!isCaposquadra && !isManager) {
                        showAlert('Non hai i permessi per accedere a questa pagina', 'error');
                        setTimeout(() => {
                            window.location.href = '../dashboard-standalone.html';
                        }, 2000);
                        return;
                    }

                    // Verifica se modulo Manodopera è attivo
                    let hasManodoperaModule = false;
                    if (currentTenantId) {
                        try {
                            const tenantDoc = await getDoc(doc(db, 'tenants', currentTenantId));
                            if (tenantDoc.exists()) {
                                const tenantData = tenantDoc.data();
                                const modules = Array.isArray(tenantData?.modules) ? tenantData.modules : [];
                                hasManodoperaModule = modules.includes('manodopera');
                                
                                // Inizializza context Tony: moduli + ruoli (profilo campo / guard APRI_PAGINA)
                                var nomeTonyVal = (`${currentUserData.nome || ''} ${currentUserData.cognome || ''}`.trim() || (user && user.email) || '');
                                var ruoliTonyVal = Array.isArray(currentUserData.ruoli) ? currentUserData.ruoli : [];
                                var tonyCampoOptsVal = { tenantId: currentTenantId, utente_corrente: { nome: nomeTonyVal, ruoli: ruoliTonyVal } };
                                if (window.Tony && window.Tony.initContextWithModules) {
                                    window.Tony.initContextWithModules(modules, tonyCampoOptsVal);
                                } else {
                                    var initTonyContext = function(retries) {
                                        retries = retries || 0;
                                        if (window.Tony && typeof window.Tony.setContext === 'function') {
                                            window.Tony.setContext('dashboard', Object.assign({
                                                info_azienda: { moduli_attivi: modules },
                                                moduli_attivi: modules
                                            }, tonyCampoOptsVal));
                                            console.log('[Validazione Ore] Context Tony inizializzato con moduli:', modules);
                                        } else if (retries < 10) {
                                            setTimeout(function() { initTonyContext(retries + 1); }, 500);
                                        }
                                    };
                                    initTonyContext();
                                }
                            }
                        } catch (error) {
                            console.warn('Errore verifica modulo Manodopera:', error);
                        }
                    }

                    if (!hasManodoperaModule) {
                        showAlert('Questa pagina è disponibile solo con il modulo Manodopera attivo.', 'error');
                        setTimeout(() => {
                            window.location.href = '../dashboard-standalone.html';
                        }, 3000);
                        return;
                    }

                    seedKpiFromDashboardSnapshot();

                    // Operai subito; tabella ore in background (come Gestione Lavori)
                    await loadOperai();
                    loadOreDaValidare()
                        .then(function () {
                            setupRealtimeListener();
                        })
                        .catch(function (err) {
                            console.warn('[Validazione Ore] loadOreDaValidare:', err);
                        });
                } else {
                    window.location.href = await loginPageUrl('../auth/login-standalone.html');
                }
            } catch (error) {
                console.error('Errore:', error);
                showAlert('Errore caricamento dati', 'error');
            }
        });

        // Operai + caposquadra (ore del capo usano operaioId = uid capo)
        async function loadOperai() {
            try {
                operaiMap.clear();
                const usersRef = collection(db, 'users');
                const ruoliManodopera = ['operaio', 'caposquadra'];
                for (const ruolo of ruoliManodopera) {
                    const q = query(
                        usersRef,
                        where('tenantId', '==', currentTenantId),
                        where('ruoli', 'array-contains', ruolo)
                    );
                    const snapshot = await getDocs(q);
                    snapshot.forEach((userDoc) => {
                        indexManodoperaUserInMap(operaiMap, userDoc.id, userDoc.data());
                    });
                }
            } catch (error) {
                console.error('Errore caricamento utenti manodopera:', error);
            }
        }

        async function ensureSegnalatoriInMap(operaioIds) {
            const unique = [...new Set((operaioIds || []).map((id) => String(id || '').trim()).filter(Boolean))];
            for (const operaioId of unique) {
                if (operaiMap.has(operaioId)) continue;
                try {
                    const userDoc = await getDoc(doc(db, 'users', operaioId));
                    if (userDoc.exists()) {
                        indexManodoperaUserInMap(operaiMap, userDoc.id, userDoc.data());
                    }
                } catch (error) {
                    console.warn('[validazione-ore] Utente non risolto:', operaioId, error);
                }
            }
        }

        // Carica ore da validare (lavori + oreOperai in parallelo)
        async function loadOreDaValidare() {
            const container = document.getElementById('ore-container');
            container.innerHTML = '<div class="loading">Caricamento ore...</div>';

            try {
                const isCaposquadra = currentUserData.ruoli && currentUserData.ruoli.includes('caposquadra');
                const isManager = currentUserData.ruoli && (currentUserData.ruoli.includes('manager') || currentUserData.ruoli.includes('amministratore'));
                const userId = currentUserData.id || currentUserData.uid;

                const bundle = await fetchLavoriWithOreOperai(currentTenantId, {
                    db, collection, getDocs, query, where
                });

                oreDaValidare = [];
                oreValidateArchivio = [];
                oreTuttePerSovrapposizione = [];
                const validateInCoda = [];
                const rifiutateInCoda = [];
                const flags = flagValidazione();

                forEachOraInBundle(bundle, function (ctx) {
                    const data = normalizeOraRecordData(ctx.oraData);
                    const record = {
                        id: ctx.oraDoc.id,
                        lavoroId: ctx.lavoroId,
                        lavoroNome: ctx.lavoroData.nome || 'N/A',
                        tipoLavoro: isLavoroAutonomo(ctx.lavoroData) ? 'autonomo' : 'squadra',
                        ...data
                    };
                    const scope = {
                        oraData: data,
                        lavoroData: ctx.lavoroData,
                        userId: flags.userId,
                        isCaposquadra: flags.isCaposquadra,
                        isManager: flags.isManager
                    };
                    if (data.stato !== 'rifiutate') oreTuttePerSovrapposizione.push(record);
                    if (!oreVisibileInCodaValidazione(scope)) {
                        if (oraVisibileInArchivioValidate({
                            ora: data,
                            lavoro: ctx.lavoroData,
                            userId: flags.userId,
                            isCaposquadra: flags.isCaposquadra,
                            isManager: flags.isManager
                        }) && giornoEntroUltimi30(data.data)) {
                            oreValidateArchivio.push(record);
                        }
                        return;
                    }

                    const stato = data.stato;
                    if (stato === 'da_validare') {
                        oreDaValidare.push(record);
                    } else if (stato === 'validate') {
                        validateInCoda.push(record);
                        if (giornoEntroUltimi30(data.data)) oreValidateArchivio.push(record);
                    } else if (stato === 'rifiutate') {
                        rifiutateInCoda.push(record);
                    }
                });

                oreDaValidare.sort((a, b) => {
                    const dateA = a.creatoIl instanceof Date ? a.creatoIl : new Date(a.creatoIl);
                    const dateB = b.creatoIl instanceof Date ? b.creatoIl : new Date(b.creatoIl);
                    return dateA - dateB;
                });

                const idsNomi = []
                    .concat(oreDaValidare, validateInCoda, rifiutateInCoda, oreValidateArchivio)
                    .flatMap((o) => [o.operaioId, o.validatoDa].concat((o.storicoModifiche || []).map((v) => v && v.da)));
                await ensureSegnalatoriInMap(idsNomi);

                setStatOre('stat-da-validare', oreDaValidare);
                setStatOre('stat-validate', validateInCoda);
                setStatOre('stat-rifiutate', rifiutateInCoda);
                renderOre();
                renderOreValidate();
                popolaFiltriValidate();
                // Reset checkbox seleziona tutto e nascondi pulsante
                const selectAllCheckbox = document.getElementById('select-all-checkbox');
                if (selectAllCheckbox) {
                    selectAllCheckbox.checked = false;
                }
                updateValidaSelezionateBtn();
            } catch (error) {
                console.error('Errore caricamento ore:', error);
                container.innerHTML = '<div class="empty-state">Errore caricamento ore</div>';
                showAlert('Errore caricamento ore', 'error');
            }
        }

            // Ascolta cambiamenti in tutti i lavori (filtriamo in loadOreDaValidare)
            const lavoriRef = collection(db, 'tenants', currentTenantId, 'lavori');
            
            onSnapshot(lavoriRef, async (lavoriSnapshot) => {

            updateValidaSelezionateBtn();

        // Aggiorna pulsante valida selezionate
        window.updateValidaSelezionateBtn = function() {

            const count = checkboxes.length;
            const btn = document.getElementById('valida-selezionate-btn');
            const countSpan = document.getElementById('count-selezionate');

                btn.style.display = 'inline-block';

        // Valida tutte le ore selezionate
        function messaggioConfermaMassa(lista) {
            const nSovra = contaRigheConSovrapposizione(lista, oreTuttePerSovrapposizione);
            const base = `Sei sicuro di voler validare ${lista.length} ${lista.length === 1 ? 'ora' : 'ore'}?`;
            if (!nSovra) return base;
            const frase = nSovra === 1
                ? '1 riga ha sovrapposizioni: controllala'
                : `${nSovra} righe hanno sovrapposizioni: controllale`;
            return `${base} ${frase}.`;
        }

        async function validaElenco(lista, btn) {
            if (!lista.length) {
                showAlert('Seleziona almeno un\'ora da validare', 'error');
                return;
            }
            if (!confirm(messaggioConfermaMassa(lista))) return;
            if (btn) {
                btn.disabled = true;
                btn.dataset.prev = btn.innerHTML;
                btn.textContent = '⏳ Validazione in corso...';
            }
            let successCount = 0;
            let errorCount = 0;
            const avvisi = [];
            try {
                for (const { lavoroId, oraId } of lista) {
                    try {
                        const esito = await validaOraContesto(db, currentTenantId, utenteValidazione(), lavoroId, oraId);
                        if (esito && esito.avvisi) avvisi.push(...esito.avvisi.filter(Boolean));
                        successCount += 1;
                    } catch (error) {
                        errorCount += 1;
                        console.error('Validazione riga', oraId, error);
                    }
                }
                if (successCount > 0) {
                    showAlert(`✅ ${successCount} ${successCount === 1 ? 'ora validata' : 'ore validate'} con successo!`, 'success');
                }
                if (avvisi.length) showAlert(avvisi[0], 'warning');
                if (errorCount > 0) {
                    showAlert(`⚠️ ${errorCount} ${errorCount === 1 ? 'ora non validata' : 'ore non validate'}.`, 'error');
                }
                await loadOreDaValidare();
            } finally {
                if (btn) {
                    btn.disabled = false;
                    if (btn.id === 'valida-selezionate-btn') {
                        btn.innerHTML = `✅ Valida Selezionate (<span id="count-selezionate">0</span>)`;
                        btn.style.display = 'none';
                    } else {
                        btn.textContent = '✅ Valida tutte';
                    }
                }
            }
        }

        function oreFiltrateArchivio() {
            const op = document.getElementById('filtro-validate-operaio').value;
            const lav = document.getElementById('filtro-validate-lavoro').value;
            return oreValidateArchivio.filter((o) => {
                if (op && String(o.operaioId) !== op) return false;
                if (lav && String(o.lavoroId) !== lav) return false;
                return true;
            });
        }

        function popolaFiltriValidate() {
            const selOp = document.getElementById('filtro-validate-operaio');
            const selLav = document.getElementById('filtro-validate-lavoro');
            if (!selOp || !selLav) return;
            const opPrev = selOp.value;
            const lavPrev = selLav.value;
            const operai = new Map();
            const lavori = new Map();
            oreValidateArchivio.forEach((o) => {
                if (o.operaioId) operai.set(String(o.operaioId), nomeUtenteOra(o.operaioId) || o.operaioId);
                if (o.lavoroId) lavori.set(String(o.lavoroId), o.lavoroNome || o.lavoroId);
            });
            selOp.innerHTML = '<option value="">Tutti</option>' + Array.from(operai.entries()).map(([id, nome]) => `<option value="${escapeHtml(id)}">${escapeHtml(nome)}</option>`).join('');
            selLav.innerHTML = '<option value="">Tutti</option>' + Array.from(lavori.entries()).map(([id, nome]) => `<option value="${escapeHtml(id)}">${escapeHtml(nome)}</option>`).join('');
            if (opPrev) selOp.value = opPrev;
            if (lavPrev) selLav.value = lavPrev;
        }

            const oraId = document.getElementById('azione-ore-ora-id').value;
            const motivo = document.getElementById('azione-ore-motivo').value.trim();
            if (!motivo) {
                showAlert('Inserisci il motivo', 'error');
                return;
            }
            try {
                const esito = tipo === 'annulla'
                    ? await annullaValidazioneOra(db, currentTenantId, utenteValidazione(), lavoroId, oraId, motivo)
                    : await rifiutaOraValidata(db, currentTenantId, utenteValidazione(), lavoroId, oraId, motivo);
                mostraAvvisiMacchina(esito);
                showAlert(tipo === 'annulla' ? 'Validazione annullata' : 'Ora rifiutata', 'success');
                closeAzioneOreModal();
                await loadOreDaValidare();
            } catch (error) {
                console.error(error);
                showAlert(`Errore: ${error.message}`, 'error');
            }
        };
    </script>
</body>
</html>
