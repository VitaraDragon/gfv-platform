<!DOCTYPE html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <title>{{gfv:title}}</title>
    {{gfv:robotsMeta}}
    {{gfv:canonical}}
    <link rel="stylesheet" href="./src/styles/pagine-tecniche.css" />
  </head>
  <body>
    <div class="page">
      <header class="top">
        <a href="/">
          <img
            class="brand-mark"
            src="../icons/gfv-mark.svg"
            width="48"
            height="48"
            alt="{{gfv:brand}}"
            decoding="async"
          />
          <span class="brand-name">{{gfv:brand}}</span>
        </a>
      </header>
      <main>
        <h1>{{gfv:h1}}</h1>
        {{gfv:contenuto}}
        <p class="offerto">{{gfv:offertoDa}}</p>
      </main>
      <nav class="nav-legale" aria-label="Informazioni legali">
        {{gfv:navLegale}}
      </nav>
    </div>
  </body>
</html>
